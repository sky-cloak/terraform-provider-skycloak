name: spec-sync

# Regenerates the API client from the app release prod serves and opens a PR. A
# sync that builds and tests cleanly merges itself once its checks pass, and
# auto-release.yml tags it. Runs when app releases or rolls back
# (repository_dispatch: openapi-updated, carrying the tag), or by hand with a
# tag. No schedule: guessing the latest release would sync past a rollback.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'App release tag prod serves, e.g. v3.5.17'
        required: true
        type: string
  repository_dispatch:
    types: [openapi-updated]

permissions:
  contents: read
  # Only to approve the bot's PR; the branch and PR are written by the app token.
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # Only ever a released app tag, which app cuts after prod deploys, so this
      # can never publish support for an API prod does not serve.
      - name: Pick the app release to sync from
        id: ref
        env:
          REF: ${{ github.event.client_payload.ref || inputs.ref }}
        run: |
          set -euo pipefail
          # An assignment, not echo "$(...)": inside echo a refusal would be
          # swallowed and the fetch below would silently read the default branch.
          ref=$(scripts/release/resolve-spec-ref.sh "$REF")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch the OpenAPI spec at that release
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_SOURCE_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          : "${REF:?no release tag resolved}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OPENAPI_SOURCE_TOKEN secret is missing or empty. Create a fine-grained PAT with Contents:Read on ${{ vars.OPENAPI_SPEC_REPO }} and store it as a repository secret named OPENAPI_SOURCE_TOKEN."
            exit 1
          fi
          gh api "repos/${{ vars.OPENAPI_SPEC_REPO }}/contents/${{ vars.OPENAPI_SPEC_PATH }}?ref=$REF" \
            -H "Accept: application/vnd.github.raw" > internal/apiclient/openapi.yaml
          # An auth/HTML error page must never regenerate the client from garbage.
          if ! head -1 internal/apiclient/openapi.yaml | grep -q '^openapi:'; then
            echo "::error::not an OpenAPI document at $REF; check OPENAPI_SOURCE_TOKEN and the spec variables"
            exit 1
          fi

      - name: Regenerate the API client
        run: make generate

      - name: Build & test against the new client
        id: verify
        continue-on-error: true
        run: |
          go vet ./... && go build ./... && go test ./...

      - name: Compute API coverage report
        id: coverage
        run: |
          {
            echo "report<<EOF"
            bash scripts/check-api-coverage.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The releaser app, not GITHUB_TOKEN: a PR opened with the default token never
      # triggers pull_request workflows, so it would have no checks to wait for.
      - name: Mint the releaser app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Open PR if the spec changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/openapi-sync
          title: "chore: sync OpenAPI spec from app ${{ steps.ref.outputs.ref }}"
          commit-message: "chore: sync OpenAPI spec from app ${{ steps.ref.outputs.ref }}"
          delete-branch: true
          body: |
            Automated sync from app `${{ steps.ref.outputs.ref }}`.

            - Build & tests after regeneration: **${{ steps.verify.outcome }}**
              (if `failure`, the spec changed in a way that needs the generated-code consumers updated).

            ### API operation coverage
            ```
            ${{ steps.coverage.outputs.report }}
            ```

            Operations listed as "not yet exposed" are candidates for new resources/tools.

      # Merges only when regeneration built and tested, and only once the PR's
      # required checks pass; an earlier auto-merge is withdrawn if this update broke.
      # Gated on the PR existing, not on this run pushing, so a re-run re-arms it.
      - name: Merge automatically once checks pass
        if: steps.pr.outputs.pull-request-number != '' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVER_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          GH_TOKEN="$APPROVER_TOKEN" gh pr review "$PR" --approve --body "Regenerated client builds and tests; merging once checks pass."
          gh pr merge "$PR" --auto --squash

      - name: Withdraw auto-merge when the regenerated client is broken
        if: steps.pr.outputs.pull-request-number != '' && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --disable-auto || true

      - name: Fail the run when the regenerated client breaks the build
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Spec sync broke build/test; fix the generated-code consumers on the sync PR, then squash-merge it by hand."
          exit 1
