name: spec-sync

# Detects upstream OpenAPI drift: pulls the latest published API spec,
# regenerates the API client, builds/tests, and opens a PR if anything changed.
# Runs weekly, on demand, and when a new spec is published
# (repository_dispatch: openapi-updated). The spec source is configured via the
# OPENAPI_SPEC_REPO / OPENAPI_SPEC_PATH repository variables.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  repository_dispatch:
    types: [openapi-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Fetch the latest OpenAPI spec
        env:
          # Token with read access to the spec source repository.
          GH_TOKEN: ${{ secrets.OPENAPI_SOURCE_TOKEN }}
        run: |
          # Fail fast with an actionable message when the secret is missing or
          # empty; the run title should carry the diagnosis, not a generic
          # gh auth hint. (This workflow failed silently for days when the
          # token secret disappeared.)
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OPENAPI_SOURCE_TOKEN secret is missing or empty. Create a fine-grained PAT with Contents:Read on ${{ vars.OPENAPI_SPEC_REPO }} and store it as a repository secret named OPENAPI_SOURCE_TOKEN."
            exit 1
          fi
          gh api "repos/${{ vars.OPENAPI_SPEC_REPO }}/contents/${{ vars.OPENAPI_SPEC_PATH }}" \
            -H "Accept: application/vnd.github.raw" > internal/apiclient/openapi.yaml
          # Sanity check: an auth/HTML error page must never regenerate the
          # client from garbage.
          if ! head -1 internal/apiclient/openapi.yaml | grep -q '^openapi:'; then
            echo "::error::Fetched file does not look like an OpenAPI document (first line is not 'openapi:'). Check the token's repository access and the OPENAPI_SPEC_REPO/OPENAPI_SPEC_PATH variables."
            exit 1
          fi

      - name: Regenerate the API client
        run: make generate

      - name: Build & test against the new client
        id: verify
        continue-on-error: true
        run: |
          go vet ./... && go build ./... && go test ./...

      - name: Compute API coverage report
        id: coverage
        run: |
          {
            echo "report<<EOF"
            bash scripts/check-api-coverage.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR if the spec changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/openapi-sync
          title: "chore: sync OpenAPI spec"
          commit-message: "chore: sync OpenAPI spec and regenerate client"
          delete-branch: true
          body: |
            Automated OpenAPI drift sync.

            - Build & tests after regeneration: **${{ steps.verify.outcome }}**
              (if `failure`, the spec changed in a way that needs the generated-code consumers updated).

            ### API operation coverage
            ```
            ${{ steps.coverage.outputs.report }}
            ```

            Operations listed as "not yet exposed" are candidates for new resources/tools.

      # PRs opened with the default token do not trigger the test workflow, so
      # a broken regeneration must fail THIS run loudly or it merges unnoticed.
      - name: Fail the run when the regenerated client breaks the build
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Spec sync broke vet/build/test; update the internal/skycloak facade before merging the sync PR."
          exit 1
