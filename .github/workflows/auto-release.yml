name: auto-release

# Tags a release after a spec sync lands on main and main's tests pass. The
# version comes from the commit types since the last tag; a breaking change
# stops here for a human.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: sync OpenAPI spec')
    runs-on: ubuntu-latest
    steps:
      - name: Mint the releaser app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      # Checked out with the app token so the tag push triggers release.yml; a tag
      # pushed with GITHUB_TOKEN would not.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' --exclude 'v*.*.*.*' HEAD 2>/dev/null); then
            echo "HEAD is already released as $tag."
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' --exclude 'v*.*.*.*')
          set +e
          next=$(git log --format='%B%x00' "$last..HEAD" | scripts/release/next-version.sh "$last")
          code=$?
          set -e
          case $code in
            0) echo "version=$next" >> "$GITHUB_OUTPUT" ;;
            4) echo "Nothing new since $last." ;;
            # 3 is a breaking change: fail so a human cuts that release.
            *) exit "$code" ;;
          esac

      - name: Tag the release
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "skycloak-releaser-bot[bot]"
          git config user.email "skycloak-releaser-bot[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
