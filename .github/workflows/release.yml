name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A pushed tag is published only from its own line: v0.* from release-0.x,
      # v1.* and later from main, and no v1.* before v1.0.0.
      - name: Check the tag is on its release line
        env:
          ACTOR: ${{ github.actor }}
        run: scripts/release/check-release-tag.sh "$GITHUB_REF_NAME" "$ACTOR"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
