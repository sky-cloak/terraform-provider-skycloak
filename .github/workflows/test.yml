name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # daily read-only acceptance smoke against dev
  workflow_dispatch:
    inputs:
      test_run:
        description: "Acceptance test filter (go test -run). Default is the read-only smoke; pass '.' to run the full create/destroy suite."
        default: "TestAccClusterLocations"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -timeout 120s
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Check the generated API client is in sync with openapi.yaml
        run: |
          go generate ./internal/apiclient/...
          git diff --exit-code internal/apiclient

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check generated docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name skycloak
          git diff --exit-code

  # Acceptance tests run against a real dev workspace. Manually dispatched.
  # Defaults to the read-only TestAccClusterLocations smoke test; pass
  # test_run=. to run the full suite (creates real clusters).
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          SKYCLOAK_API_KEY: ${{ secrets.SKYCLOAK_ACCEPTANCE_TEST_DEV_API_KEY }}
          SKYCLOAK_ENDPOINT: ${{ secrets.SKYCLOAK_ACCEPTANCE_TEST_DEV_ENDPOINT }}
        run: go test ./internal/provider/... -v -timeout 120m -run "${{ inputs.test_run || 'TestAccClusterLocations' }}"
