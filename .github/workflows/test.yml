name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -timeout 120s
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Check the generated API client is in sync with openapi.yaml
        run: |
          go generate ./internal/apiclient/...
          git diff --exit-code internal/apiclient

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check generated docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name skycloak
          git diff --exit-code

  # Acceptance tests create real resources; run manually or on a schedule with a
  # dev-workspace key in the SKYCLOAK_API_KEY secret.
  acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          SKYCLOAK_API_KEY: ${{ secrets.SKYCLOAK_API_KEY }}
          SKYCLOAK_ENDPOINT: ${{ secrets.SKYCLOAK_ENDPOINT }}
        run: go test ./internal/provider/... -v -timeout 120m
