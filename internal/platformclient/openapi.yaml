        nextCursor:
          type: string
          description: Set when older events follow; absent on the last page.
      description: A page of audit events, newest first. Pass `nextCursor` back as `cursor` for older ones.
    AuditOutcome:
      type: string
      enum:
        - succeeded
        - refused
        - failed
      description: How an audited act ended.
    Branding:
      type: object
      required:
        - primaryColor
        - accentColor
        - backgroundColor
        - textColor
        - font
        - links
        - updatedAt
      properties:
        logoUrl:
          type: string
          format: uri
          description: |-
            The address the project's uploaded logo is served on, on the project's own sign-in address;
            absent when it has none. Only the logo upload sets it, and a replacement of the branding
            keeps it.
          readOnly: true
        primaryColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of buttons and links, as `#` and six hex digits: `#1d64f2` by default.'
        accentColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of highlights and focus rings, as `#` and six hex digits: `#1d64f2` by default.'
        backgroundColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: "The page's background color, as `#` and six hex digits: `#ffffff` by default."
        textColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of text, as `#` and six hex digits: `#18181b` by default.'
        font:
          allOf:
            - $ref: '#/components/schemas/Font'
          description: '`system` by default.'
        productName:
          type: string
          maxLength: 60
          description: |-
            The name of the project's product, shown on the page and in the emails, at most 60
            characters; absent by default. Absent, or only spaces, the branding has none.
        links:
          type: array
          items:
            $ref: '#/components/schemas/BrandingLink'
          maxItems: 5
          description: The links shown at the foot of the page and the emails, at most five; none by default.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        How a project's hosted sign-in page and its code, reset and invite emails look. A project has
        one branding and no draft: a replacement is what the page and the emails show from then on. A
        project that never set it has the defaults each field names.
    BrandingLink:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: The link's text, from 1 to 40 characters.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: 'Where it leads: an `https` address of at most 2048 characters, with no user or password.'
      description: A link at the foot of a project's hosted page and emails, such as its terms or its support.
    BrandingPreview:
      type: object
      required:
        - target
        - branding
      properties:
        target:
          $ref: '#/components/schemas/PreviewTarget'
        branding:
          allOf:
            - $ref: '#/components/schemas/Branding'
          description: 'The draft: every field a replacement takes, as it takes them.'
      description: 'A preview to render: what, and with which draft branding.'
    BrokerProvider:
      type: object
      required:
        - id
        - type
        - name
        - issuer
        - clientId
        - authorizationEndpoint
        - tokenEndpoint
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        type:
          allOf:
            - $ref: '#/components/schemas/BrokerProviderType'
          description: The kind of provider.
          readOnly: true
        name:
          type: string
          description: A name for the provider, 1 to 100 characters, for the project's admins.
          readOnly: true
        issuer:
          type: string
          format: uri
          description: "The provider's issuer: an `https` address, fixed for a `google` or `github` provider."
          readOnly: true
        clientId:
          type: string
          description: The client ID the project holds at the provider.
          readOnly: true
        authorizationEndpoint:
          type: string
          format: uri
          description: The provider's authorization endpoint, from discovery or fixed by its type.
          readOnly: true
        tokenEndpoint:
          type: string
          format: uri
          description: The provider's token endpoint, from discovery or fixed by its type.
          readOnly: true
        jwksUri:
          type: string
          format: uri
          description: The address of the provider's signing keys. A `github` provider has none and leaves it out.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A sign-in provider a project's sign-in can send people to. An `oidc` provider finds its
        endpoints from the issuer's discovery document, so the issuer must serve one over HTTPS. A
        `google` or `github` provider needs only a client ID and a client secret: the issuer and
        endpoints are fixed, and a project holds at most one provider of each.
    BrokerProviderCreate:
      type: object
      required:
        - clientId
        - clientSecret
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BrokerProviderType'
          description: The kind of provider. Left out, it is `oidc`.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |-
            A name for the provider, 1 to 100 characters, for the project's admins. Required for an
            `oidc` provider; left out on a `google` or `github` provider, it is `Google` or `GitHub`.
        issuer:
          type: string
          format: uri
          maxLength: 2048
          description: |-
            The provider's issuer: an `https` address without a query or fragment, at most 2048
            characters. Required for an `oidc` provider and left out on a `google` or `github` one.
        clientId:
          type: string
          minLength: 1
          maxLength: 512
          description: The client ID the project holds at the provider, 1 to 512 characters.
        clientSecret:
          type: string
          minLength: 1
          maxLength: 4096
          description: The client secret the project holds at the provider. It is kept sealed and never answered.
      description: |-
        What a project sends to add a provider. Without a `type` the provider is `oidc`, and it needs
        a name and an issuer. A `google` or `github` provider sends a client ID and a client secret
        only; sending an issuer is refused, and a project holds at most one provider of each.
    BrokerProviderPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrokerProvider'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    BrokerProviderType:
      type: string
      enum:
        - oidc
        - google
        - github
      description: The kind of a sign-in provider.
    BrokerRule:
      type: object
      required:
        - id
        - position
        - kind
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        position:
          type: integer
          format: int32
          description: Where the rule stands in the order it is tried, from 1.
          readOnly: true
        kind:
          $ref: '#/components/schemas/BrokerRuleKind'
        domain:
          type: string
          maxLength: 253
          description: The domain of an email domain rule, such as `example.com`, answered in lowercase.
        providerId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The provider an email domain or default rule sends people to.
        lookupUrl:
          type: string
          format: uri
          maxLength: 2048
          description: "The address of a private lookup rule's service: an `https` address of at most 2048 characters."
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A rule that picks a provider for an email. A project's rules are tried in their order and the
        first match decides; a default rule is always last. A rule uses the fields of its kind and
        leaves the others out: an email domain rule has `domain` and `providerId`, a private lookup
        rule has `lookupUrl` and `lookupKey`, and a default rule has `providerId` only.
    BrokerRuleCreate:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/BrokerRuleKind'
        domain:
          type: string
          maxLength: 253
          description: The domain of an email domain rule, such as `example.com`, answered in lowercase.
        providerId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The provider an email domain or default rule sends people to.
        lookupUrl:
          type: string
          format: uri
          maxLength: 2048
          description: "The address of a private lookup rule's service: an `https` address of at most 2048 characters."
        lookupKey:
          type: string
          minLength: 1
          maxLength: 4096
          description: |-
            The key a private lookup's requests are signed with, 1 to 4096 characters. It is kept sealed
            and never answered.
      description: |-
        A rule that picks a provider for an email. A project's rules are tried in their order and the
        first match decides; a default rule is always last. A rule uses the fields of its kind and
        leaves the others out: an email domain rule has `domain` and `providerId`, a private lookup
        rule has `lookupUrl` and `lookupKey`, and a default rule has `providerId` only.
    BrokerRuleKind:
      type: string
      enum:
        - email_domain
        - private_lookup
        - default
      description: How a rule decides which provider an email goes to.
    BrokerRulePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrokerRule'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    BrokerSetting:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the broker is on.
      description: |-
        Whether a project's sign-in uses the broker. The broker is off until it is turned on, and a
        project that never turns it on signs in as it did before. Adding or removing a provider or a
        rule never changes this setting.
    ClientType:
      type: string
      enum:
        - confidential
        - public
      description: Whether an app can keep a secret.
    ConnectionStatus:
      type: string
      enum:
        - connected
        - pending
        - not_set_up
      description: How far an organization's company sign-in (SSO) or automatic user sync (SCIM) has come.
    CreatedOrganizationSetupLink:
      type: object
      required:
        - id
        - organizationId
        - status
        - createdAt
        - expiresAt
        - url
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/OrganizationSetupLinkStatus'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 24 hours after it was made.'
          readOnly: true
        revokedAt:
          type: string
          format: date-time
          description: When the link was revoked; absent for a link that was not.
          readOnly: true
        replacedBy:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The link that replaced this one; absent for a link that was not replaced.
          readOnly: true
        url:
          type: string
          format: uri
          description: |-
            The setup page's address on the project's sign-in address. It is answered this once: only a
            hash of its token is kept. Whoever holds it can set up the organization's connections until
            it stops working.
          readOnly: true
      description: A setup link just made, with the address that opens it.
    Credential:
      type: object
      required:
        - id
        - type
        - label
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/CredentialType'
        label:
          type: string
          description: The name the user gave it; empty when they gave none.
        rpId:
          type: string
          description: |-
            For a passkey, the address it signs in on (its WebAuthn relying party ID): the project's
            sign-in address or one of its verified domains.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When it was last used, an authenticator's confirming code included; absent when it never was.
      description: |-
        One of a user's second factors: a passkey or a confirmed authenticator. Its key or secret is
        never read through this API.
    CredentialList:
      type: object
      required:
        - items
        - recoveryCodesLeft
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
          description: The user's passkeys and confirmed authenticators, oldest first.
        recoveryCodesLeft:
          type: integer
          format: int32
          description: How many of the user's recovery codes are not yet used.
      description: A user's second factors and how many of their recovery codes are left.
    CredentialType:
      type: string
      enum:
        - passkey
        - authenticator
      description: What kind of second factor a credential is.
    CustomDomain:
      type: object
      required:
        - id
        - hostname
        - status
        - records
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes.
        status:
          allOf:
            - $ref: '#/components/schemas/CustomDomainStatus'
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: The CNAME record, then the TXT record.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        checkedAt:
          type: string
          format: date-time
          description: When its records were last looked up; absent when they never were.
          readOnly: true
        verifiedAt:
          type: string
          format: date-time
          description: When it was verified; absent unless it is.
          readOnly: true
      description: |-
        One of a project's own domains. Adding it answers the two DNS records that verify it: a CNAME
        from the domain to the project's sign-in address, and a TXT record holding a token of the
        domain's own that proves who added it. A verified domain is not yet served: its sign-in page
        answers there once certificates are issued for it.
    CustomDomainList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomDomain'
          description: Every custom domain of the project, oldest first.
      description: A project's custom domains.
    CustomDomainStatus:
      type: string
      enum:
        - pending
        - verified
        - failed
      description: Where a custom domain stands in its verification.
    DnsRecord:
      type: object
      required:
        - type
        - name
        - value
      properties:
        type:
          $ref: '#/components/schemas/DnsRecordType'
        name:
          type: string
          description: "The record's name: the full name, with no trailing dot."
        value:
          type: string
          description: The record's value.
      description: A DNS record the owner of a custom domain sets at their DNS provider.
    DnsRecordType:
      type: string
      enum:
        - CNAME
        - TXT
      description: The type of a DNS record to set.
    DomainRecord:
      type: object
      required:
        - type
        - name
        - value
      properties:
        type:
          type: string
          enum:
            - TXT
          description: 'The record type: always `TXT`.'
        name:
          type: string
          description: The name to publish the record at.
        value:
          type: string
          description: The value the record must hold.
      description: A DNS record to publish.
    EmailActivity:
      type: object
      required:
        - defaultSendsToday
        - defaultSendCap
        - failures
        - senderHealth
      properties:
        defaultSendsToday:
          type: integer
          format: int32
          description: How many mails the shared default sender sent for the project today (UTC), fallback mail included.
        defaultSendCap:
          type: integer
          format: int32
          description: How many mails the default sender sends for the project in a day (UTC). The next one is refused; a production project sends through its own provider.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/SmtpFailure'
          description: The most recent failures of the project's own provider, newest first, at most 50.
        senderHealth:
          allOf:
            - $ref: '#/components/schemas/SenderHealth'
          description: How the default sender is doing; the same for a project that has its own provider, which the default sender does not serve.
      description: How a project's mail has gone lately.
    Environment:
      type: string
      enum:
        - production
        - staging
        - development
      description: |-
        What a project is for. A label only: limits and billing treat every environment alike, and
        changing it never changes the project's address.
    Error:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - message
      properties:
        type:
          type: string
          description: "`about:blank`: `code` gives the reason and `title` is the status's own phrase."
        title:
          type: string
          description: The HTTP status's phrase, for example `Bad Request`.
        status:
          type: integer
          format: int32
          description: The HTTP status.
        detail:
          type: string
          description: A sentence for people, which may change; the same as `message`.
        code:
          type: string
          description: A stable, machine-readable reason, for example `not_found`.
        message:
          type: string
          description: A sentence for people, which may change.
        field:
          type: string
          description: |-
            The field of the request that was refused, as the API names it, for example `primaryColor`
            or `links[2].url`; absent when the error is not about one field.
      description: |-
        Why a request failed: an RFC 9457 problem, with `code`, `message` and `field` as its extension
        members.
    FirstLoginReport:
      type: object
      required:
        - since
        - signedUp
        - firstLogins
        - underFiveMinutes
        - recent
      properties:
        since:
          type: string
          format: date-time
          description: The earliest sign-up counted.
        signedUp:
          type: integer
          format: int32
          description: Workspaces that signed up.
        firstLogins:
          type: integer
          format: int32
          description: Of them, those that had a first test login.
        underFiveMinutes:
          type: integer
          format: int32
          description: Of them, those whose first test login came less than five minutes after the sign-up.
        medianMinutes:
          type: number
          description: The median minutes to a first test login; absent when none has come.
        recent:
          type: array
          items:
            $ref: '#/components/schemas/FirstLoginTime'
          description: The latest sign-ups, newest first, at most 100.
      description: |-
        Sign-up to first test login over the workspaces that signed up since a time, from the two
        times each workspace keeps.
    FirstLoginTime:
      type: object
      required:
        - workspaceId
        - signedUpAt
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        signedUpAt:
          type: string
          format: date-time
          description: When the person whose first sign-in made the workspace signed up.
        firstTestLoginAt:
          type: string
          format: date-time
          description: When the engine issued the workspace's first real token; absent until it has.
        minutes:
          type: number
          description: Minutes from the sign-up to the first test login; absent until it has come.
      description: One workspace's time from its sign-up to its first test login.
    FirstRun:
      type: object
      required:
        - workspaceId
        - projectId
        - projectName
        - region
        - address
        - issuer
        - appId
        - clientId
        - redirectUri
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: 'The first project: a development project in the US region.'
        projectName:
          type: string
          description: The project's display name, the workspace's name when it was made.
        region:
          $ref: '#/components/schemas/Region'
        address:
          type: string
          description: The project's sign-in address.
        issuer:
          type: string
          format: uri
          description: The project's token issuer.
        appId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: "The project's default app: public, with PKCE required and redirect addresses on localhost."
        clientId:
          type: string
          description: The client ID the default app sends. It has no secret.
        redirectUri:
          type: string
          format: uri
          description: The redirect address the snippets use, one of the default app's.
        testUser:
          allOf:
            - $ref: '#/components/schemas/TestUser'
          description: The test user to sign in with; absent once it is deleted.
      description: |-
        What a workspace's first project needs to add sign-in to an app: made with the workspace by
        the first sign-in of the person who signed up, with no question asked. It never holds an API
        key or a client secret.
    FirstTestLogin:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
          description: Whether the first login has come.
        receivedAt:
          type: string
          format: date-time
          description: When the engine issued the first real token, the workspace's first test login; absent until it has.
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The first project; absent once it is deleted.
        user:
          allOf:
            - $ref: '#/components/schemas/FirstTestLoginUser'
          description: Who signed in; absent until the first login, and once that user is deleted.
      description: |-
        Whether the workspace's first project has issued its first real token: the first time an app
        of the project exchanged an authorization code for tokens. Once received it stays received.
    FirstTestLoginUser:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          description: The user's email address, absent for a user who signs in another way.
      description: The user whose sign-in was the first project's first login.
    Font:
      type: string
      enum:
        - system
        - inter
        - roboto
        - lato
        - montserrat
        - merriweather
      description: |-
        The typeface of a project's hosted pages and emails. Each is bundled with the sign-in engine,
        so the hosted page loads no font from another origin.
    GrantType:
      type: string
      enum:
        - authorization_code
        - refresh_token
        - client_credentials
      description: An OAuth 2.1 grant an app may use.
    Hook:
      type: object
      required:
        - id
        - projectId
        - moment
        - url
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        moment:
          $ref: '#/components/schemas/HookMoment'
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS endpoint that receives the hook request. It must resolve only to public addresses.
            Private, loopback, link-local and metadata addresses are refused at configuration and invocation.
        timeout:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: How long to wait for a response, in whole seconds.
          default: 3
        on_failure:
          allOf:
            - $ref: '#/components/schemas/HookFailurePolicy'
          description: How a failed call affects sign-up or sign-in.
          default: block
        enabled:
          type: boolean
          description: Whether the hook runs at its configured moment.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: A project's HTTPS hook that can block sign-up or sign-in or add claims to tokens.
    HookFailurePolicy:
      type: string
      enum:
        - block
        - continue
      description: What happens if the hook times out or fails to return a valid response.
    HookMergePatchUpdate:
      type: object
      properties:
        moment:
          $ref: '#/components/schemas/HookMoment'
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS endpoint that receives the hook request. It must resolve only to public addresses.
            Private, loopback, link-local and metadata addresses are refused at configuration and invocation.
        timeout:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 5
          description: How long to wait for a response, in whole seconds.
        on_failure:
          allOf:
            - $ref: '#/components/schemas/HookFailurePolicy'
          nullable: true
          description: How a failed call affects sign-up or sign-in.
        enabled:
          type: boolean
          nullable: true
          description: Whether the hook runs at its configured moment.
      description: A project's HTTPS hook that can block sign-up or sign-in or add claims to tokens.
    HookMoment:
      type: string
      enum:
        - sign_up
        - sign_in
      description: When a hook runs in a project's sign-in flow.
    HookPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hook'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    HookWithSecret:
      type: object
      required:
        - id
        - projectId
        - moment
        - url
        - createdAt
        - signingSecret
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        moment:
          $ref: '#/components/schemas/HookMoment'
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS endpoint that receives the hook request. It must resolve only to public addresses.
            Private, loopback, link-local and metadata addresses are refused at configuration and invocation.
        timeout:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: How long to wait for a response, in whole seconds.
          default: 3
        on_failure:
          allOf:
            - $ref: '#/components/schemas/HookFailurePolicy'
          description: How a failed call affects sign-up or sign-in.
          default: block
        enabled:
          type: boolean
          description: Whether the hook runs at its configured moment.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        signingSecret:
          type: string
          description: The generated signing secret. Save it when it is returned because it cannot be read back.
          readOnly: true
      description: A hook with its signing secret, returned only on creation or rotation.
    Id:
      type: string
      format: uuid
      description: A resource's identifier, assigned by the platform.
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          maxLength: 254
          description: The teammate's email address.
        role:
          allOf:
            - $ref: '#/components/schemas/InvitationRole'
          description: The chosen team role, or viewer for legacy invitations without a chosen role.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When it was sent, or last sent again.
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this it can no longer be accepted: 14 days after it was sent.'
          readOnly: true
      description: |-
        An invitation for a teammate to join the workspace. It is accepted on the teammate's next
        sign-in to the console with the invited email address verified, which makes them a member.
    InvitationRole:
      type: string
      enum:
        - owner
        - admin
        - member
        - viewer
      description: Team invitation roles, including the legacy read-only role.
    IpRule:
      type: object
      required:
        - id
        - action
        - cidr
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        action:
          $ref: '#/components/schemas/IpRuleAction'
        cidr:
          type: string
          maxLength: 43
          pattern: ^[0-9A-Fa-f:.]+/[0-9]{1,3}$
          description: |-
            The addresses covered, as an IPv4 or IPv6 range in CIDR notation, such as `203.0.113.0/24`.
            A single address is a `/32` or a `/128`. The pattern is the shape only; a range whose address
            or prefix length is out of bounds still answers 400.
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A rule on which network addresses may sign in to a project. Rules are optional: a project with
        none lets every address sign in. With one allow rule or more, only the addresses they cover
        may; a deny rule refuses the addresses it covers whatever the allow rules say.
    IpRuleAction:
      type: string
      enum:
        - allow
        - deny
      description: What an IP rule does with the addresses it covers.
    IpRulePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    KeycloakCredential:
      type: object
      required:
        - type
        - secretData
        - credentialData
      properties:
        id:
          type: string
          description: The credential's ID in Keycloak.
        userLabel:
          type: string
          description: The credential's label in Keycloak.
        createdDate:
          type: integer
          format: int64
          description: When Keycloak created the credential, in milliseconds since 1970.
        priority:
          type: integer
          format: int32
          description: The credential's priority in Keycloak.
        type:
          type: string
          enum:
            - password
          description: Always `password`.
        secretData:
          type: string
          description: "A JSON document in a string: the hash's `value` and `salt`, in base64."
        credentialData:
          type: string
          description: 'A JSON document in a string: `hashIterations`, `algorithm` and `additionalParameters`.'
      description: |-
        A password credential of a Keycloak realm export. Only `type`, `secretData` and
        `credentialData` are read; the others the export writes may be sent and are ignored.
    MailNotification:
      type: object
      required:
        - Type
        - MessageId
        - TopicArn
        - Message
        - Timestamp
        - SignatureVersion
        - Signature
        - SigningCertURL
      properties:
        Type:
          type: string
        MessageId:
          type: string
        TopicArn:
          type: string
        Message:
          type: string
        Timestamp:
          type: string
        SignatureVersion:
          type: string
        Signature:
          type: string
        SigningCertURL:
          type: string
        Subject:
          type: string
        SubscribeURL:
          type: string
        Token:
          type: string
      description: The notice SNS delivers to the intake, signed by SNS. Only a notice signed for the expected topic is read.
    ManagedCustomDomain:
      type: object
      required:
        - hostname
        - ownershipStatus
        - tlsStatus
        - records
        - ready
        - active
        - createdAt
      properties:
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes. Another project's domain cannot be
            added.
        ownershipStatus:
          type: string
          description: |-
            Where the ownership check stands, in Cloudflare's words: `pending` while its TXT record is
            not found, `active` once it is, anything else a failure described by `verificationError`.
          readOnly: true
        tlsStatus:
          type: string
          description: |-
            Where the certificate stands, in Cloudflare's words: `pending` while one is being issued,
            `active` once it is deployed, anything else a failure described by `verificationError`.
          readOnly: true
        verificationError:
          type: string
          description: What Cloudflare last said about a step that failed; absent when none did.
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: |-
            The CNAME record, then the TXT record. Empty until Cloudflare has answered with the
            ownership record, which happens as the domain is added.
          readOnly: true
        ready:
          type: boolean
          description: Whether the ownership and the certificate are both active, so the domain can be activated.
          readOnly: true
        active:
          type: boolean
          description: Whether the domain has been activated, so it serves.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        checkedAt:
          type: string
          format: date-time
          description: When Cloudflare was last asked about the domain; absent when it never was.
          readOnly: true
        activatedAt:
          type: string
          format: date-time
          description: When the domain was activated; absent unless it is active.
          readOnly: true
        deactivateAt:
          type: string
          format: date-time
          description: |-
            When the domain stops serving because the workspace dropped to a plan without a custom
            domain; absent when none is scheduled. The record is kept, and an upgrade cancels it.
          readOnly: true
      description: |-
        A project's one custom domain, served through Cloudflare for SaaS beside the project's
        permanent address. Adding it answers the two DNS records to publish: a CNAME from the domain
        to `skycloak-dns.io` and a TXT record that proves who owns it. It serves nothing until the
        project's admin activates it, which is refused until both the ownership and the certificate
        are active. Once active it is a sign-in address of its own, with itself as the issuer.
    McpProtectedResourceMetadata:
      type: object
      required:
        - resource
        - resource_name
        - authorization_servers
        - scopes_supported
      properties:
        resource:
          type: string
          format: uri
        resource_name:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
        scopes_supported:
          type: array
          items:
            type: string
      description: An RFC 9728 document to publish on the project's own MCP resource server.
    McpRegistrationPolicy:
      type: object
      required:
        - dynamicRegistration
        - clientIdMetadataDocuments
      properties:
        dynamicRegistration:
          type: boolean
        clientIdMetadataDocuments:
          type: boolean
      description: Independent permissions for the project's client registration, which apply to every app. Both default to off on every tier. Client ID metadata documents are recommended. Dynamic registration is the fallback for clients that cannot use them. A project holds at most 200 dynamically registered clients on Free and 10,000 on a paid tier, a client unused for 30 days is deleted, and one source address may register at most 10 clients per hour on one project and 30 per hour across all projects, past which registration answers 429 with Retry-After.
    McpServer:
      type: object
      required:
        - id
        - url
        - name
        - scopes
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Exact HTTPS resource identifier, without user information or a fragment. Unique in this project.
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
          maxItems: 100
          description: Distinct OAuth scope tokens, each 1 to 256 ASCII characters.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A declared MCP protected resource, stored in the project's region.
    McpServerMergePatchUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Exact HTTPS resource identifier, without user information or a fragment. Unique in this project.
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
          maxItems: 100
          description: Distinct OAuth scope tokens, each 1 to 256 ASCII characters.
      description: A declared MCP protected resource, stored in the project's region.
    McpServerPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpServer'
        nextCursor:
          type: string
      description: A page of MCP servers, ordered by ID.
    MemberRoleChange:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    MfaPolicy:
      type: object
      required:
        - policy
        - updatedAt
      properties:
        policy:
          $ref: '#/components/schemas/TwoStep'
        updatedAt:
          type: string
          format: date-time
          description: When the project's sign-in settings last changed.
          readOnly: true
      description: |-
        A project's MFA policy. It is the project's `twoStep` setting, read and changed on its own, so
        changing it leaves every other sign-in setting as it is.
    NewAuditDelivery:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: The HTTPS address events are sent to.
      description: What the console sends to set up or move audit delivery.
    NewInvitation:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
          description: The teammate's email address, one plain address such as `sam@acme.example`.
        role:
          allOf:
            - $ref: '#/components/schemas/TeamRole'
          description: |-
            Chosen team role. Omission preserves the legacy read-only invitation. Only Owners invite
            Owners. Mock server only for now: the live endpoint does not take it yet and answers 400 to a
            body that carries it.
      description: What the console sends to invite a teammate.
    NewOidcConnection:
      type: object
      required:
        - issuer
        - clientId
        - clientSecret
      properties:
        issuer:
          type: string
          maxLength: 2048
          description: "The provider's issuer address: an https address with no query or fragment, at most 2048 characters."
        clientId:
          type: string
          maxLength: 255
          description: The client ID the project registered with the provider, 1 to 255 characters.
        clientSecret:
          type: string
          maxLength: 4096
          description: The client secret the project registered with the provider. It is stored encrypted and never returned.
        scopes:
          type: array
          items:
            type: string
          description: 'The scopes to ask for, at most 20, which must include `openid`. Absent: `openid`, `email` and `profile`.'
        requireSso:
          type: boolean
          description: "Whether the organization's staff must sign in through the provider. Absent: false."
      description: What creating a connection sends.
    NewOrganization:
      type: object
      required:
        - projectId
        - name
      properties:
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |-
            The project the organization's staff sign in to, one of the workspace's. A create without one
            answers 400; a project that is not one of the workspace's answers 404.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            type: string
          description: |-
            Domains to add, each unverified until the organization proves it holds it. Each is trimmed
            and lowercased, then must be a domain as `OrganizationDomain.name` takes one, or the create
            answers 400; a domain named twice is added once.
      description: 'What a create sends: the project, the name and any domains to verify.'
    NewOrganizationDomain:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 253
          description: |-
            The domain, trimmed and lowercased, which must be a domain as `OrganizationDomain.name` takes
            one, or the add answers 400.
      description: 'What adding a domain sends: its name.'
    NewOrganizationInvitation:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The address to email the link to. Trimmed and lowercased.
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What creating an invitation sends: the address to invite and the role the person gets.'
    NewOrganizationMember:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The user to add. A user the project does not have answers 404.
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What adding a member sends: an existing user of the project and the role they get.'
    NewProjectOrganization:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            type: string
          description: |-
            Domains to add, each unverified until the organization proves it holds it. Each is trimmed
            and lowercased, then must be a domain as `OrganizationDomain.name` takes one, or the create
            answers 400; a domain named twice is added once.
      description: 'What a create under a project sends: the name and any domains to verify.'
    NewWorkspace:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
      description: What the console sends to create a workspace.
    OidcClaim:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value: {}
      description: 'One claim a provider returned: its name and its value, which may be any JSON value.'
    OidcConnection:
      type: object
      required:
        - issuer
        - clientId
        - scopes
        - status
        - requireSso
        - createdAt
        - updatedAt
      properties:
        issuer:
          type: string
          description: The provider's issuer address, an https address with no query or fragment.
        clientId:
          type: string
          description: The client ID the project registered with the provider.
        scopes:
          type: array
          items:
            type: string
          description: The scopes asked of the provider, always including `openid`.
        status:
          $ref: '#/components/schemas/OidcConnectionStatus'
        requireSso:
          type: boolean
          description: Whether the organization's staff must sign in through the provider.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: |-
        An organization's company sign-in (SSO) through its own OpenID Connect provider. It never
        carries the client secret: the secret is stored encrypted and no operation returns it.
    OidcConnectionChange:
      type: object
      properties:
        issuer:
          type: string
          maxLength: 2048
          description: The new issuer address, as `NewOidcConnection.issuer` takes one.
        clientId:
          type: string
          maxLength: 255
          description: The new client ID.
        clientSecret:
          type: string
          maxLength: 4096
          description: 'A new client secret, which replaces the stored one. Absent: the stored secret stays.'
        scopes:
          type: array
          items:
            type: string
          description: The new scopes, which replace the old and must include `openid`.
        requireSso:
          type: boolean
          description: Whether the organization's staff must sign in through the provider.
      description: 'What updating a connection sends: only the fields to change.'
    OidcConnectionStatus:
      type: string
      enum:
        - pending
        - connected
      description: How far an organization's OpenID Connect connection has come.
    OidcConnectionTest:
      type: object
      required:
        - ok
        - discovery
      properties:
        ok:
          type: boolean
          description: Whether every step worked.
        discovery:
          allOf:
            - $ref: '#/components/schemas/OidcTestStep'
          description: The provider's discovery document was fetched and names the issuer the connection holds.
        tokenExchange:
          allOf:
            - $ref: '#/components/schemas/OidcTestStep'
          description: |-
            The client was exchanged for a token at the provider's token endpoint with its secret.
            Absent when discovery failed.
        claims:
          type: array
          items:
            $ref: '#/components/schemas/OidcClaim'
          description: |-
            The claims of the ID token the provider returned, or of its access token when that is a
            signed token, by name; absent when the provider returned neither. Read from the token, not
            verified.
      description: |-
        What a test of a connection found: the discovery of the provider's settings, the token
        exchange with the client, and the claims the provider returned.
    OidcTestStep:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        reason:
          type: string
          description: Why the step failed, in words, with the provider's own error when it gave one; absent when it worked.
      description: 'One step of a connection test: whether it worked, and why not when it did not.'
    Organization:
      type: object
      required:
        - id
        - workspaceId
        - projectId
        - name
        - domains
        - sso
        - scim
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The project the organization's staff sign in to. Fixed when the organization is created.
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDomain'
          description: The organization's domains, in the order they were added.
          readOnly: true
        sso:
          allOf:
            - $ref: '#/components/schemas/SsoConnection'
          readOnly: true
        scim:
          allOf:
            - $ref: '#/components/schemas/ScimConnection'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        An organization: one business customer of a project, whose staff sign in to that project's apps.
        Its IT admin connects company sign-in (SSO) and automatic user sync (SCIM) through a setup link.
    OrganizationChange:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
      description: 'What an update sends: the new name, the only part of an organization that changes.'
    OrganizationDomain:
      type: object
      required:
        - name
        - verified
      properties:
        name:
          type: string
          maxLength: 253
          pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
          description: The domain, lowercase, for example `globex.example`.
        verified:
          type: boolean
          description: Whether the organization proved it holds the domain, with a DNS record its setup link asks for.
        verifiedAt:
          type: string
          format: date-time
          description: When it was verified; absent while it is not.
        dnsRecord:
          allOf:
            - $ref: '#/components/schemas/DomainRecord'
          description: |-
            The DNS TXT record that proves the organization holds the domain; absent once it is verified.
            Publish it, then verify the domain.
      description: A domain an organization's staff have email addresses at.
    OrganizationInvitation:
      type: object
      required:
        - id
        - organizationId
        - email
        - role
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          maxLength: 254
          format: email
          description: The invited address, lowercase. Only a person signed in with this verified email address can accept.
        role:
          allOf:
            - $ref: '#/components/schemas/OrganizationRole'
          description: The role the person gets on joining.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 7 days after the invitation was made.'
          readOnly: true
      description: |-
        An offer to join an organization with a role, made to one email address. It is pending until
        the person accepts it, it is revoked or it expires. Its single-use token is only in the email
        and is never part of the API.
    OrganizationInvitationPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvitation'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationMember:
      type: object
      required:
        - userId
        - role
        - createdAt
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          format: email
          description: The user's email address; absent when the user has none.
          readOnly: true
        displayName:
          type: string
          description: The user's name for people; absent when the user has none.
          readOnly: true
        role:
          $ref: '#/components/schemas/OrganizationRole'
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A user of the project in an organization, with the one role the project's apps authorize them
        on. Owner, admin and member are labels for apps; they give no access to this API.
    OrganizationMemberChange:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What changing a member sends: the role that replaces theirs.'
    OrganizationMemberPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: 'What an organization is to a person: the one role their membership has.'
    OrganizationSetupLink:
      type: object
      required:
        - id
        - organizationId
        - status
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/OrganizationSetupLinkStatus'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 24 hours after it was made.'
          readOnly: true
        revokedAt:
          type: string
          format: date-time
          description: When the link was revoked; absent for a link that was not.
          readOnly: true
        replacedBy:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The link that replaced this one; absent for a link that was not replaced.
          readOnly: true
      description: |-
        A link the organization's IT admin opens, with no sign-in of their own, to set up the
        organization's company sign-in and user sync on the project's own sign-in address. It works for
        24 hours, until it is revoked, or until a newer link for the organization replaces it. Its
        token is in the address returned once when it is made, and is never part of a list.
    OrganizationSetupLinkPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSetupLink'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationSetupLinkStatus:
      type: string
      enum:
        - active
        - expired
        - revoked
        - replaced
      description: Where a setup link stands. A link that was replaced is replaced, even if it also expired.
    PasswordHash:
      type: object
      properties:
        keycloak:
          allOf:
            - $ref: '#/components/schemas/KeycloakCredential'
          description: |-
            One password credential of a Keycloak realm export, as the export writes it under the
            user's `credentials`, hashed with argon2 (argon2id), pbkdf2, pbkdf2-sha256 or
            pbkdf2-sha512.
        auth0:
          type: string
          minLength: 1
          description: A bcrypt hash from an Auth0 export, starting `$2a$` or `$2b$`.
      description: |-
        A password hash from another identity provider. Exactly one of `keycloak` and `auth0` is
        set. It is stored as it is, only ever checked against, and replaced with argon2id the next
        time its user signs in with it.
    PreviewTarget:
      type: string
      enum:
        - page
        - email_code
        - email_reset
        - email_invite
      description: What a branding preview renders.
    Project:
      type: object
      required:
        - id
        - workspaceId
        - name
        - region
        - displayName
        - address
        - issuer
        - createdAt
        - state
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          description: |-
            The first label of the project's address, generated when the project is created: a caller
            cannot choose it. Unique within its region, never given to another project, and permanent.

            A name is one lowercase DNS label: a-z, 0-9 and hyphens, 3 to 63 characters, starting and
            ending with a letter or digit. These names are reserved and never given to a project: trial,
            admin, api, docs, support, www, app, auth, root, master, console and platform.
          readOnly: true
        region:
          allOf:
            - $ref: '#/components/schemas/Region'
          description: The region the project's users live in. Permanent.
        environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          description: 'What the project is for: `development` unless the create names another. It may change after.'
          default: development
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: A name for people, for example "Production".
        address:
          type: string
          description: The project's sign-in address, `{name}.{region}.skycloakid.com`. Permanent.
          readOnly: true
        issuer:
          type: string
          format: uri
          description: The project's token issuer, `https://{name}.{region}.skycloakid.com`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        state:
          allOf:
            - $ref: '#/components/schemas/ProjectState'
          description: |-
            Whether the project serves sign-in. A `suspended` project was paused after 104 days without
            activity: its address answers 503 until an Owner restores it. A `deleted` project answers 410
            until it is restored or purged.
          readOnly: true
        restoreBy:
          type: string
          format: date-time
          description: 'Set while the project is `suspended`: when it is deleted unless an Owner restores it first.'
          readOnly: true
      description: |-
        A project: one isolated sign-in space with its own apps, users and settings, served at
        `{name}.{region}.skycloakid.com`. That address is the project's token issuer and is
        permanent, so its name and region never change.
    ProjectMergePatchUpdate:
      type: object
      properties:
        environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          nullable: true
          description: 'What the project is for: `development` unless the create names another. It may change after.'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: A name for people, for example "Production".
      description: |-
        A project: one isolated sign-in space with its own apps, users and settings, served at
        `{name}.{region}.skycloakid.com`. That address is the project's token issuer and is
        permanent, so its name and region never change.
    ProjectPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    ProjectState:
      type: string
      enum:
        - active
        - suspended
        - deleted
      description: Whether a project serves sign-in.
    ProjectUsage:
      type: object
      required:
        - projectId
        - displayName
        - activeUsers
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        activeUsers:
          type: integer
          format: int32
          minimum: 0
      description: One project's distinct users with an interactive sign-in this calendar month.
    Readiness:
      type: object
      required:
        - checks
        - warnings
        - region
        - checkedAt
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
          description: Every check, once each, in the order of `ReadinessCheckId`.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessWarning'
          description: |-
            Warnings, once each, empty when there are none. A production project with no SMTP provider
            of its own gets one: the default sender is shared and limited to 1,000 emails a day, with
            no custom From address and no custom email templates, which come with its own provider.
        region:
          allOf:
            - $ref: '#/components/schemas/Region'
          description: The project's region, which the `data_region` check names.
        checkedAt:
          type: string
          format: date-time
          description: When the checks were read.
      description: |-
        A project's readiness for a buyer's security review: each check, on or off as the project
        stands now, read from its settings, organizations, IP rules and the workspace's audit
        delivery. It changes nothing; each check's own settings turn it on.
    ReadinessCheck:
      type: object
      required:
        - id
        - state
      properties:
        id:
          $ref: '#/components/schemas/ReadinessCheckId'
        state:
          $ref: '#/components/schemas/ReadinessState'
      description: One check of a project's readiness and where it stands.
    ReadinessCheckId:
      type: string
      enum:
        - sso
        - scim
        - two_step_required
        - passkeys
        - breached_password_check
        - audit_delivery
        - session_limits
        - data_region
        - ip_rules
      description: |-
        One check of a buyer's security review, in the order a project's readiness lists them. Each
        reads state the project, its organizations or its workspace already hold.
    ReadinessState:
      type: string
      enum:
        - 'on'
        - 'off'
        - info
      description: Where a readiness check stands.
    ReadinessWarning:
      type: object
      required:
        - id
        - message
      properties:
        id:
          $ref: '#/components/schemas/ReadinessWarningId'
        message:
          type: string
          description: What the warning says, in plain words.
      description: A warning on a project's readiness. It never blocks sign-in or changing the environment.
    ReadinessWarningId:
      type: string
      enum:
        - default_sender_in_production
      description: What a readiness warning is about.
    RecoveryCodes:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            type: string
          description: The codes, each good for one sign-in. They are stored only hashed and never answered again.
      description: A new set of recovery codes, answered once.
    Region:
      type: string
      enum:
        - us
        - eu
      description: A region the engine runs in. A project's region is fixed when it is created.
    Role:
      type: string
      enum:
        - owner
        - admin
        - viewer
      description: A person's role in a workspace, from most to least power.
    ScimConnection:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        lastSyncAt:
          type: string
          format: date-time
          description: When its directory last synced; absent until it has.
      description: The organization's automatic user sync (SCIM) from its own directory.
    Scope:
      type: string
      enum:
        - workspaces:read
        - workspaces:write
        - projects:read
        - projects:write
        - projects:delete
        - apps:read
        - apps:write
        - users:read
        - users:write
        - organizations:read
        - organizations:write
        - settings:read
        - settings:write
        - signing_keys:rotate
      description: |-
        What an API key may do: read or write one kind of resource, or one of the two acts only an
        Owner may grant. A write scope never includes `projects:delete` or `signing_keys:rotate`.
    SenderHealth:
      type: object
      required:
        - status
        - sendCap
      properties:
        status:
          $ref: '#/components/schemas/SenderStatus'
        reason:
          allOf:
            - $ref: '#/components/schemas/SenderReason'
          description: The rate that tripped the rule; absent while healthy.
        rate:
          type: number
          description: That rate as a fraction, 0.024 for 2.4%; absent while healthy.
        limit:
          type: number
          description: The limit the rate passed, as a fraction; absent while healthy.
        sendCap:
          type: integer
          format: int32
          description: How many mails the default sender sends the project in a day (UTC) in this state.
        since:
          type: string
          format: date-time
          description: When the sender entered this state; absent while healthy.
        until:
          type: string
          format: date-time
          description: When a paused sender's 24 hours end and its rates are checked again; absent unless paused. A time already past means the rates were still over the limit when checked.
      description: |-
        How the default sender is doing for a project, from the bounces and complaints of its mails over
        the last 7 days. Rates count only once the project has sent 100 mails in that time.
    SenderReason:
      type: string
      enum:
        - bounces
        - complaints
      description: Which rate tripped the rule.
    SenderStatus:
      type: string
      enum:
        - healthy
        - limited
        - paused
      description: Whether the default sender is sending as usual.
    Session:
      type: object
      required:
        - email
        - accessToken
        - accessTokenExpiresAt
      properties:
        email:
          type: string
          description: The signed-in person's email address.
        accessToken:
          type: string
          description: |-
            A console access token for this API, sent as a bearer token. Read the session again for a
            new one before it expires.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When the access token stops working.
        givenName:
          type: string
          description: The person's first name, which the console greets them by; absent when it is not known.
        newWorkspace:
          allOf:
            - $ref: '#/components/schemas/Workspace'
          description: |-
            The workspace the person's first sign-in made for them, which the console names on Home.
            Present only on the answer to that sign-in.
        newProject:
          allOf:
            - $ref: '#/components/schemas/Project'
          description: |-
            The first project the person's first sign-in made in that workspace, a development project in
            the US region with a default app, which the console opens. Present only on the answer to
            that sign-in.
      description: |-
        The console session of the person signed in. The session itself is the `session` cookie, set
        HttpOnly, Secure and SameSite=Strict on the console's address; the answer carries a short-lived
        access token for the operations that take a bearer token.
    SessionLimits:
      type: object
      required:
        - maxLifetime
        - idleTimeout
        - recommendedMaxLifetime
        - recommendedIdleTimeout
        - updatedAt
      properties:
        maxLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 36000
          description: 'Seconds a session lasts from its sign-in, however active: 3600 to 36000 (10 hours).'
        idleTimeout:
          type: integer
          format: int32
          minimum: 300
          maximum: 36000
          description: 'Seconds a session lasts with no token issued in it: 300 to 36000, at most `maxLifetime`.'
        recommendedMaxLifetime:
          type: integer
          format: int32
          description: The longest `maxLifetime` Skycloak recommends, in seconds; below 36000, so a lifetime above it can be saved.
          readOnly: true
        recommendedIdleTimeout:
          type: integer
          format: int32
          description: The longest `idleTimeout` Skycloak recommends, in seconds; below 36000, so an idle timeout above it can be saved.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the project's sign-in settings last changed.
          readOnly: true
      description: |-
        How long a project's sessions last, beside the longest Skycloak recommends for each. The two
        limits are the project's `sessionMaxLifetime` and `sessionIdleLifetime` settings, read and
        changed on their own, so changing them leaves every other sign-in setting as it is. A limit
        above its recommended maximum is allowed; the console flags it.
    Settings:
      type: object
      required:
        - dynamicRegistration
        - passwordEnabled
        - passkeyEnabled
        - emailCodeEnabled
        - twoStep
        - emailSignUp
        - accessTokenLifetime
        - refreshTokenLifetime
        - idTokenLifetime
        - sessionIdleLifetime
        - sessionMaxLifetime
        - updatedAt
      properties:
        dynamicRegistration:
          type: boolean
          description: Clients may register dynamically on the project's sign-in address. Off by default.
        passwordEnabled:
          type: boolean
          description: Users may sign in with a password.
        passkeyEnabled:
          type: boolean
          description: Users may sign in with a passkey.
        emailCodeEnabled:
          type: boolean
          description: Users may sign in with a code sent to their email address.
        twoStep:
          $ref: '#/components/schemas/TwoStep'
        emailSignUp:
          type: boolean
          description: People may sign up with their email address on the project's sign-in page.
        accessTokenLifetime:
          type: integer
          format: int32
          minimum: 60
          maximum: 3600
          description: 'Seconds an access token is accepted: 60 to 3600, 300 by default.'
        refreshTokenLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 2592000
          description: |-
            Seconds a refresh token works: 3600 to 2592000 (30 days), 604800 (7 days) by default. Each
            refresh replaces it, and none outlives its session.
        idTokenLifetime:
          type: integer
          format: int32
          minimum: 60
          maximum: 3600
          description: 'Seconds an ID token is valid: 60 to 3600, 300 by default.'
        sessionIdleLifetime:
          type: integer
          format: int32
          minimum: 300
          maximum: 36000
          description: |-
            Seconds a session lasts with no token issued in it: 300 to 36000 (10 hours), 1800 by
            default. At most `sessionMaxLifetime`.
        sessionMaxLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 36000
          description: |-
            Seconds a session lasts from its sign-in, however active: 3600 to 36000 (10 hours), the
            longest by default.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        How a project's users sign in and sign up, and how long their tokens and sessions live. At
        least one way to sign in stays on. A project that never set the lifetimes gets the defaults
        each one names. A new lifetime applies to the next token or session the project issues, never
        to one already issued.
    SetupLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: The setup page's address. Whoever holds it can set up the organization until it expires.
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 7 days after it was made.'
        sentTo:
          type: string
          format: email
          description: The address the link was just emailed to; absent when the request named none.
      description: |-
        A setup link: the page where the organization's IT admin verifies its domains and connects
        company sign-in (SSO) and automatic user sync (SCIM) to their own identity provider, with no
        console sign-in of their own.
    SetupLinkRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The IT admin's email address; absent to answer the link without sending it.
      description: 'What a setup link request sends: an address to email the link to, or nothing.'
    SignInCode:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The email address the code was sent to.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: |-
            The 6-digit code from the email. It works once, for 10 minutes, and the fifth wrong code
            voids it.
        termsVersion:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          description: |-
            The version of the Platform Terms and Acceptable Use Policy the person accepted, such as
            `2026-11`. A first sign-in, which signs the person up, must send it,
            or it is refused with the `terms_required` code and the code stays valid until it
            expires or signs the person in with `termsVersion`. It is stored with the
            time of acceptance for the person who signs up. A returning person need not send it, and it changes
            nothing for a person who has signed up already.
      description: Completes a sign-in with the code emailed to the address.
    SignInCodeRequest:
      type: object
      required:
        - email
        - turnstileToken
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: |-
            The person's work email address. The same address signs a person in or, the first time,
            signs them up.
        turnstileToken:
          type: string
          minLength: 1
          maxLength: 2048
          description: A fresh Turnstile proof solved on the console hostname for console_sign_in. A missing or failed proof answers the common 400 problem.
      description: Asks for a sign-in code by email.
    SignInEvent:
      type: object
      required:
        - id
        - projectId
        - region
        - at
        - type
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        region:
          type: string
          description: The region the project, and so the event, lives in.
        at:
          type: string
          format: date-time
          description: When it happened.
        type:
          $ref: '#/components/schemas/SignInEventType'
        clientId:
          type: string
          description: The OAuth client ID of the app involved; absent when none was.
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The ID of the user involved; absent when none could be told, such as a sign-in for an unknown name.
        ipAddress:
          type: string
          description: The network address the request came from.
        userAgent:
          type: string
          description: The user agent the request came with.
      description: |-
        One event on a project's sign-in address, kept for audit. An event never holds a secret or a
        token.
    SignInEventPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignInEvent'
          description: The events on this page, newest first.
        nextCursor:
          type: string
          description: Set when older events follow; absent on the last page.
      description: A page of a project's sign-in events, newest first. Pass `nextCursor` back as `cursor` for older ones.
    SignInEventType:
      type: string
      enum:
        - login
        - login_error
        - logout
        - token_issue
        - token_refresh
        - mfa
        - password_change
      description: A kind of sign-in event a project records and a webhook may receive.
    SmtpFailure:
      type: object
      required:
        - failedAt
        - error
      properties:
        failedAt:
          type: string
          format: date-time
        error:
          type: string
          description: The SMTP server's error, cut to 500 characters.
      description: A send through a project's own provider that failed.
    SmtpProvider:
      type: object
      required:
        - host
        - port
        - username
        - passwordSet
        - fromAddress
        - tlsMode
        - updatedAt
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
          description: The SMTP server's host name or IP address, with no scheme or port.
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        username:
          type: string
          maxLength: 256
        passwordSet:
          type: boolean
          description: Whether a password is stored.
          readOnly: true
        fromAddress:
          type: string
          minLength: 3
          maxLength: 320
          description: The address the project's mail comes from. Only a project with its own provider has one.
        tlsMode:
          $ref: '#/components/schemas/SmtpTlsMode'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A project's own SMTP provider. A project with none sends its sign-in mail from the shared
        default sender, which is limited to 1,000 emails a day and always uses the Skycloak address as
        its From address. With a provider the project's mail goes through it, from `fromAddress`. The
        password is sealed when stored and is never answered: `passwordSet` says only that one is
        stored.
    SmtpProviderCreateOrUpdate:
      type: object
      required:
        - host
        - port
        - username
        - fromAddress
        - tlsMode
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
          description: The SMTP server's host name or IP address, with no scheme or port.
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
          description: |-
            The password, sent when it is first set or changes. Leaving it out keeps the stored one; the
            first write needs it. It is never in an answer.
        fromAddress:
          type: string
          minLength: 3
          maxLength: 320
          description: The address the project's mail comes from. Only a project with its own provider has one.
        tlsMode:
          $ref: '#/components/schemas/SmtpTlsMode'
      description: |-
        A project's own SMTP provider. A project with none sends its sign-in mail from the shared
        default sender, which is limited to 1,000 emails a day and always uses the Skycloak address as
        its From address. With a provider the project's mail goes through it, from `fromAddress`. The
        password is sealed when stored and is never answered: `passwordSet` says only that one is
        stored.
    SmtpTestRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          minLength: 3
          maxLength: 320
          description: The address that gets the test mail.
      description: Where to send the test mail.
    SmtpTestResult:
      type: object
      required:
        - sent
        - message
      properties:
        sent:
          type: boolean
          description: Whether the provider accepted the mail.
        message:
          type: string
          description: "What happened in plain words: that the mail was sent, or the SMTP server's error."
      description: How a test send ended.
    SmtpTlsMode:
      type: string
      enum:
        - starttls
        - tls
        - none
      description: How a project's connection to its SMTP server is secured.
    SsoConnection:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        lastSignInAt:
          type: string
          format: date-time
          description: When one of its staff last signed in through it; absent until someone has.
      description: The organization's company sign-in (SSO) connection to its own identity provider.
    StaffAuditRecord:
      type: object
      required:
        - id
        - actorEmail
        - actorSubject
        - action
        - target
        - reason
        - requestId
        - at
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The record's ID.
        actorEmail:
          type: string
          description: The email address of the staff member who acted, as Skycloak's IAM gave it at sign-in.
        actorSubject:
          type: string
          description: The staff member's stable subject at Skycloak's IAM.
        action:
          type: string
          description: What was done, for example `workspaces.suspend`.
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The workspace acted on; absent when the act concerns no one workspace.
        target:
          type: string
          description: The ID of what was acted on; empty when the action names it.
        reason:
          type: string
          description: Why the staff member did it, in their words; empty when the action takes none.
        requestId:
          type: string
          description: The ID of the request that did it.
        at:
          type: string
          format: date-time
          description: When it was done.
      description: |-
        One act of a staff member through the staff app. Staff audit records are apart from the
        workspaces' own audit records: no customer ever reads them, and staff activity never lands in a
        workspace's audit log.
    StaffAuditRecordPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffAuditRecord'
          description: The records on this page, newest first.
        nextCursor:
          type: string
          description: Set when more records follow; absent on the last page.
      description: A page of the staff audit log. Pass `nextCursor` back as `cursor` to read the next page.
    StaffOverview:
      type: object
      required:
        - signUpsToday
        - signUpsThisWeek
        - firstLoginsToday
        - activeProjects
      properties:
        signUpsToday:
          type: integer
          format: int32
          description: Workspaces that signed up since midnight UTC today.
        signUpsThisWeek:
          type: integer
          format: int32
          description: Workspaces that signed up since midnight UTC on this week's Monday.
        firstLoginsToday:
          type: integer
          format: int32
          description: Workspaces whose first test login came since midnight UTC today, whenever they signed up.
        p50Minutes:
          type: number
          description: |-
            The median minutes from sign-up to first test login, over the workspaces that signed up in
            the last 7 days and have had one; absent while none has.
        p90Minutes:
          type: number
          description: |-
            The 90th percentile minutes from sign-up to first test login, over the same workspaces as
            `p50Minutes`; absent while none has.
        activeProjects:
          type: integer
          format: int32
          description: Projects of every workspace that are not deleted.
      description: |-
        Sign-ups, first logins and active projects across every workspace, as of the request. Days and
        weeks are UTC, and a week starts on Monday.
    StaffSession:
      type: object
      required:
        - email
        - expiresAt
      properties:
        email:
          type: string
          description: The signed-in person's email address at Skycloak's IAM.
        name:
          type: string
          description: The person's full name; absent when the IAM does not know it.
        expiresAt:
          type: string
          format: date-time
          description: When the session ends; the person signs in again after it.
      description: |-
        The staff session of the person signed in. The session itself is the `staff_session` cookie,
        set HttpOnly, Secure and SameSite=Strict on the staff app's address.
    StaffSignInCallback:
      type: object
      required:
        - code
        - state
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 4096
          description: The authorization code. It works once.
        state:
          type: string
          minLength: 1
          maxLength: 512
          description: The state, which must be the one this browser's sign-in started with.
      description: What the IAM sent back to the staff app's redirect address.
    StaffSignInRedirect:
      type: object
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: The IAM's sign-in address, carrying this sign-in's state and PKCE code challenge.
      description: Where to send the browser to sign in.
    StaffSignInStart:
      type: object
      required:
        - redirectUri
      properties:
        redirectUri:
          type: string
          format: uri
          maxLength: 2048
          description: |-
            The staff app address the IAM sends the browser back to with the code and state, one the
            staff app's client registers.
      description: Starts a staff sign-in through Skycloak's IAM.
    TeamRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: The roles offered by workspace team settings.
    TestUser:
      type: object
      required:
        - id
        - username
        - password
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: The email address the test user signs in with on the project's login page.
        password:
          type: string
          description: The test user's generated password, kept until the test user is deleted.
      description: |-
        The user a workspace's first project is made with, to sign in to the app once without signing
        anyone up. It is marked as a test user: never counted in the project's users, as active or on a
        bill.
    Tier:
      type: string
      enum:
        - free
        - pro
        - scale
      description: The workspace's plan.
    TrialMove:
      type: object
      required:
        - id
        - workspaceId
        - trialId
        - region
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        trialId:
          type: string
          minLength: 1
          maxLength: 100
          description: The Dedicated trial being moved.
        region:
          type: string
          description: 'The region the Free project is created in. It is `us`: moved trials run on the US Shared Cluster.'
          readOnly: true
        state:
          allOf:
            - $ref: '#/components/schemas/TrialMoveState'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |-
            The Free project the trial moves into; absent until the move has made it, and again after a
            failed move has removed it.
          readOnly: true
        failureCode:
          type: string
          description: Why a failed move stopped, as a stable code; absent unless `state` is `failed`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When `state` last changed.
          readOnly: true
      description: |-
        The move of one active Dedicated trial into a Free project of a workspace. The trial's owner
        asks for it; it keeps the trial's users, apps and identity providers and ends the Dedicated
        trial once the project answers.
    TrialMoveCreate:
      type: object
      required:
        - trialId
        - platformLoginConfirmed
      properties:
        trialId:
          type: string
          minLength: 1
          maxLength: 100
          description: The Dedicated trial being moved.
        platformLoginConfirmed:
          type: boolean
          description: |-
            Whether the person has explicitly created or confirmed their Platform login for this move:
            the separate login that signs in with an emailed code, never the Skycloak login. It must be
            `true`, and the person must be an Owner of the workspace, which makes them its first Owner.
      description: |-
        The move of one active Dedicated trial into a Free project of a workspace. The trial's owner
        asks for it; it keeps the trial's users, apps and identity providers and ends the Dedicated
        trial once the project answers.
    TrialMoveState:
      type: string
      enum:
        - requested
        - exporting
        - importing
        - routing
        - done
        - failed
      description: |-
        How far a trial's move to the Platform has come. A move starts as `requested` and goes through
        `exporting`, `importing` and `routing` to `done`; any step that fails ends it as `failed`.
        `done` and `failed` are final.
    TwoStep:
      type: string
      enum:
        - 'off'
        - optional
        - required
      description: Whether users sign in with a second factor.
    UsageRate:
      type: object
      required:
        - unitPrice
      properties:
        upTo:
          type: integer
          format: int32
          minimum: 1
          description: Inclusive upper total; absent for the final, unbounded band.
        unitPrice:
          type: number
          minimum: 0
          description: USD per additional active user in this band.
      description: A marginal rate above the included users, based on each project's total active users.
    User:
      type: object
      required:
        - id
        - projectId
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          format: email
          description: The user's email address, unique within the project regardless of case.
        displayName:
          type: string
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          description: Whether an admin has locked the user out. A locked user cannot sign in.
        lockedAt:
          type: string
          format: date-time
          description: When the user was first locked; absent while they are not locked.
          readOnly: true
        lastSignInAt:
          type: string
          format: date-time
          description: When the user last signed in; absent when they never have.
          readOnly: true
        mfaMethods:
          type: array
          items:
            $ref: '#/components/schemas/CredentialType'
          description: |-
            The kinds of second factor the user has enrolled, each named once; empty when they have
            none. Answered only when reading one user.
          readOnly: true
        activeSessions:
          type: integer
          format: int32
          description: How many of the user's sessions are active. Answered only when reading one user.
          readOnly: true
        test:
          type: boolean
          description: |-
            Whether this is the test user a workspace's first project is made with. A test user signs
            in like any other but is never counted in the project's users, as active or on a bill.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A person who signs in to a project's apps. Users live in the project's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The user's email address, unique within the project regardless of case.
        displayName:
          type: string
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          description: Whether an admin has locked the user out. A locked user cannot sign in.
        passwordHash:
          allOf:
            - $ref: '#/components/schemas/PasswordHash'
          description: |-
            The password hash the user brings from Keycloak or Auth0, so they keep their password.
            Sent only when creating a user, who then needs an `email`; never read back.
      description: |-
        A person who signs in to a project's apps. Users live in the project's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserMergePatchUpdate:
      type: object
      properties:
        email:
          type: string
          nullable: true
          format: email
          description: The user's email address, unique within the project regardless of case.
        displayName:
          type: string
          nullable: true
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          nullable: true
          description: Whether an admin has locked the user out. A locked user cannot sign in.
      description: |-
        A person who signs in to a project's apps. Users live in the project's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    Webhook:
      type: object
      required:
        - id
        - projectId
        - url
        - eventTypes
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          description: Whether events are sent to the endpoint.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        Where a project's sign-in events are sent as they happen: one HTTPS address of the customer's
        own system, and the event types it receives. Each event is sent as a POST, signed with the
        endpoint's signing secret (HMAC-SHA256) over the timestamp, a `.` and the raw body
        (`timestamp.body`), with the timestamp, the event's ID and its type in headers. A receiver
        rejects a timestamp older than 5 minutes. Delivery is at least once and unordered, so a
        receiver tells repeats by the event ID.
    WebhookDelivery:
      type: object
      required:
        - id
        - eventId
        - eventType
        - status
        - attempts
        - at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        eventId:
          type: string
          description: The ID of the event delivered.
        eventType:
          $ref: '#/components/schemas/SignInEventType'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
          format: int32
          description: How many times the event has been sent.
        httpStatus:
          type: integer
          format: int32
          description: The HTTP status of the last try; absent when it did not get an answer.
        at:
          type: string
          format: date-time
          description: When the last try was made.
        error:
          type: string
          maxLength: 200
          description: Why the last try failed, trimmed to a short text; absent when it did not fail.
      description: One event's delivery to a webhook. The address's response body is never kept.
    WebhookDeliveryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
          description: The deliveries on this page, newest first.
        nextCursor:
          type: string
          description: Set when older deliveries follow; absent on the last page.
      description: A page of a webhook's deliveries, newest first. Pass `nextCursor` back as `cursor` for older ones.
    WebhookDeliveryStatus:
      type: string
      enum:
        - delivered
        - rejected
        - failed
        - retrying
      description: How one delivery of an event to a webhook went.
    WebhookMergePatchUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          nullable: true
          description: Whether events are sent to the endpoint.
      description: |-
        Where a project's sign-in events are sent as they happen: one HTTPS address of the customer's
        own system, and the event types it receives. Each event is sent as a POST, signed with the
        endpoint's signing secret (HMAC-SHA256) over the timestamp, a `.` and the raw body
        (`timestamp.body`), with the timestamp, the event's ID and its type in headers. A receiver
        rejects a timestamp older than 5 minutes. Delivery is at least once and unordered, so a
        receiver tells repeats by the event ID.
    WebhookPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WebhookWithSecret:
      type: object
      required:
        - id
        - projectId
        - url
        - eventTypes
        - createdAt
        - signingSecret
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          description: Whether events are sent to the endpoint.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        signingSecret:
          type: string
          description: The secret events are signed with. It is never shown again.
          readOnly: true
      description: A webhook with its signing secret, answered only when it is created or its secret rotated.
    Workspace:
      type: object
      required:
        - id
        - name
        - createdAt
        - status
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: |-
            The signed-in person's role in this workspace, which the console shows its controls by.
            Absent when an API key reads the workspace.
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/WorkspaceStatus'
          description: |-
            Whether the workspace is open to its members and API keys. While it is `suspended`, every
            call on it answers 403 with the code `workspace_suspended`, and the console shows a notice
            in place of its pages.
          readOnly: true
      description: |-
        A customer workspace: the company that signs up. It owns its API keys and its projects, and
        holds no end-user data.
    WorkspaceMember:
      type: object
      required:
        - id
        - name
        - email
        - role
        - joinedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        joinedAt:
          type: string
          format: date-time
      description: A person who has joined the workspace, not an end user of a project.
    WorkspaceMemberPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WorkspaceMergePatchUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
      description: |-
        A customer workspace: the company that signs up. It owns its API keys and its projects, and
        holds no end-user data.
    WorkspacePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WorkspaceStatus:
      type: string
      enum:
        - active
        - suspended
      description: Whether a workspace is open to its members and API keys.
    WorkspaceUsage:
      type: object
      required:
        - tier
        - monthlyPrice
        - includedActiveUsers
        - monthStart
        - monthEnd
        - rates
        - projects
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        monthlyPrice:
          type: number
          minimum: 0
          description: USD per month; Scale has a yearly term.
        includedActiveUsers:
          type: integer
          format: int32
          minimum: 1
        monthStart:
          type: string
          format: date-time
          description: The UTC calendar month, starting at midnight on its first day.
        monthEnd:
          type: string
          format: date-time
          description: The next month's first midnight, exclusive.
        rates:
          type: array
          items:
            $ref: '#/components/schemas/UsageRate'
          description: Marginal bands in ascending order, ending with an unbounded band.
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectUsage'
          description: All projects of this workspace, including those with no sign-ins.
      description: Current calendar-month usage. Counts and the included allowance apply per project.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: |-
        The console session of the person signed in, for the few operations an API key may not call
        because they act before the person has a workspace.
    StaffSessionAuth:
      type: apiKey
      in: cookie
      name: staff_session
      description: |-
        The staff session of one of Skycloak's own people, signed in to the staff app through
        Skycloak's IAM. It is apart from the console's session: no console session, console access
        token or API key is ever a staff session.
servers:
  - url: https://api.skycloak.io
    description: The public API.
    variables: {}
