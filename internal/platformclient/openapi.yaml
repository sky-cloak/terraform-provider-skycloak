        '403':
          description: |-
            The request sent an Authorization header: an API key or a console access token never reaches
            a staff operation, whatever cookie comes with it. Or the person signed in through Skycloak's
            IAM does not hold the staff role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address to the sign-in operations, or from one staff
            session to the others, within the operation's limit.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Staff
      security:
        - StaffSessionAuth: []
  /v1/staff/session:
    get:
      operationId: StaffSessions_read
      description: Reads the staff session of the cookie.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            There is no staff session: the `staff_session` cookie is missing, unknown, expired or ended.
            The console's `session` cookie is not a staff session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            The request sent an Authorization header: an API key or a console access token never reaches
