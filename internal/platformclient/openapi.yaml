            type: string
            format: uri
          description: The exact addresses the project may send users back to after sign-in.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the project may send users back to after sign-out.
        backchannelLogoutUri:
          type: string
          format: uri
          description: The https address the project POSTs a logout token to when a session of the app ends (OpenID Connect Back-Channel Logout 1.0). Absolute, with a host and no fragment or credentials; any other address is refused with a 400 naming `backchannelLogoutUri`. Absent when the app has none; send `null` in an update to remove it.
