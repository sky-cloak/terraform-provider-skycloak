openapi: 3.0.0
info:
  title: Skycloak Platform API
  version: '1'
  description: |-
    The one public API of the Skycloak platform: the only way in, used by the console, the CLI,
    the MCP server and customers' own systems.

    A workspace is the company that signs up. It owns its API keys and one or more projects
    (production, staging, development). A project is one isolated sign-in space at its permanent
    address, `{name}.{region}.skycloakid.com`, in one region fixed at creation. Apps, users and
    sign-in settings belong to one project; users live in the project's region and never in the
    control plane. An account is one person's login to the console, not a resource of this API.
tags:
  - name: Workspaces
  - name: Usage
  - name: API keys
  - name: Projects
  - name: Apps
  - name: Users
  - name: Settings
  - name: Branding
  - name: Domains
  - name: Sessions
  - name: Funnel
  - name: First run
  - name: Invitations
  - name: Audit
  - name: Webhooks
  - name: Hooks
  - name: Members
  - name: Organizations
  - name: Trial moves
  - name: Staff
paths:
  /v1/first-logins:
    get:
      operationId: FirstLogins_report
      description: |-
        Reports how long new workspaces took from sign-up to their first test login. It reads every
        workspace, so only Skycloak's own staff, signed in to the console, may call it; no API key and
        no workspace role may.
      parameters:
        - name: since
          in: query
          required: false
          description: The earliest sign-up to count; 30 days ago when absent.
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstLoginReport'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The console access token is missing, unknown or expired, or its session has ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not one of Skycloak's staff signed in to the console, or sent an API key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The caller sent more requests than its API key's or its workspace's limit allows.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Funnel
  /v1/mail/notifications:
    post:
      operationId: MailNotifications_receive
      description: |-
        Receives the bounce and complaint notices Amazon SES sends for the default sender, through
        SNS. It takes no bearer credential: the signature of each notice is checked against Amazon's
        certificate and the notice's topic against the one expected, and anything else answers 403.
        It also confirms the subscription of that topic. A permanent bounce or a complaint counts
        towards the rates of the project its mail was sent for.
      parameters: []
      responses:
        '204':
          description: 'Answered by an action with nothing to return: it is done.'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The notice's signature does not verify, or it is for another topic.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many notices came from the caller's address within the limit. No API key is sent here.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailNotification'
      security:
        - {}
  /v1/session:
    get:
      operationId: Sessions_read
      description: Reads the session of the cookie, with a new access token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The session cookie is missing, unknown, expired or ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'An API key was sent: these operations take the session cookie or no credential, never a key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address, or named the same email address, within
            the operation's limit. No API key is sent here, so the limit is never a key's or a workspace's.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Sessions
      security:
        - SessionAuth: []
    delete:
      operationId: Sessions_delete
      description: 'Signs the person out: ends the session, revokes its access tokens and clears the cookie.'
      parameters: []
      responses:
        '204':
          description: 'Answered by a delete: the resource is gone.'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The session cookie is missing, unknown, expired or ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'An API key was sent: these operations take the session cookie or no credential, never a key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address, or named the same email address, within
            the operation's limit. No API key is sent here, so the limit is never a key's or a workspace's.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Sessions
      security:
        - SessionAuth: []
  /v1/sign-in:
    post:
      operationId: SignIns_create
      description: |-
        Emails a 6-digit sign-in code to the address through the platform's mail sender. Answers 202
        whether or not anyone has signed in with the address, so the answer never tells who has. A
        new request replaces any code sent to the address before it.
      parameters: []
      responses:
        '202':
          description: Answered when the request is taken and finishes later.
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'An API key was sent: these operations take the session cookie or no credential, never a key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address, or named the same email address, within
            the operation's limit. No API key is sent here, so the limit is never a key's or a workspace's.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCodeRequest'
      security:
        - {}
  /v1/sign-in/complete:
    post:
      operationId: SignIns_complete
      description: |-
        Signs the person in with the code emailed to them and sets the session cookie. A wrong,
        expired or voided code answers 401, the same for each; the person asks for a new code. A
        person's first sign-in also signs them up: it makes their workspace, with them as its Owner,
        and its first project with a default app, and answers them as `newWorkspace` and `newProject`.
        A first sign-in without `termsVersion` signs nobody up and
        answers 400 with the code `terms_required` and the field `termsVersion`; the code stays
        valid until it expires or is used, so the person sends it again with `termsVersion`. Only a person who proved the address with its code is
        told, so the answer says no more than the code's owner could learn by signing in.
      parameters: []
      responses:
        '201':
          description: 'Answered by a create: the new resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            The code is wrong, expired, already used or voided by five wrong tries; the answer is the same
            for each, and for an address no code was sent to. The person asks for a new code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'An API key was sent: these operations take the session cookie or no credential, never a key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address, or named the same email address, within
            the operation's limit. No API key is sent here, so the limit is never a key's or a workspace's.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCode'
      security:
        - {}
  /v1/staff/audit-records:
    get:
      operationId: StaffAuditRecords_list
      description: |-
        Lists the staff audit log, newest first, a page at a time: every record, or those of one
        workspace, of one staff member, or both. A cursor that is not a previous page's `nextCursor`
        is a 400.
      parameters:
        - name: workspaceId
          in: query
          required: false
          description: Only the records of this workspace.
          schema:
            $ref: '#/components/schemas/Id'
          explode: false
        - name: actor
          in: query
          required: false
          description: Only the records of this staff member, by their IAM subject or, ignoring case, their email address.
          schema:
            type: string
            minLength: 1
            maxLength: 320
          explode: false
        - $ref: '#/components/parameters/PageParameters.limit'
        - $ref: '#/components/parameters/PageParameters.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAuditRecordPage'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            There is no staff session: the `staff_session` cookie is missing, unknown, expired or ended.
            The console's `session` cookie is not a staff session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            The request sent an Authorization header: an API key or a console access token never reaches
            a staff operation, whatever cookie comes with it. Or the person signed in through Skycloak's
            IAM does not hold the staff role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
            Too many requests came from the caller's address to the sign-in operations, or from one staff
            session to the others, within the operation's limit.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Staff
      security:
        - StaffSessionAuth: []
  /v1/staff/overview:
    get:
      operationId: StaffOverviews_read
      description: Reads the Overview of sign-ups, first logins and active projects across every workspace.
      parameters: []
      responses:
