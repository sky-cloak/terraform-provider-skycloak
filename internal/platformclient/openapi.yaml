  /v1/workspaces/{workspaceId}/projects/{projectId}/branding/preview:
    post:
      operationId: ProjectBranding_preview
      description: |-
        Renders a project's hosted page or one of its emails with draft branding and saves nothing,
        so the console can show a change before it is saved. The sign-in engine of the project's
        region renders it, with the email copy the engine fixes and the project's current logo: the
        draft's `logoUrl` is ignored, as a replacement ignores it. A draft a replacement would
        refuse answers 400 naming the field. When the engine cannot be reached the preview answers
        `503 engine_unavailable`. A project of another workspace, or a deleted one, answers 404. The
        answer is a whole HTML document, sent with a policy that sandboxes it: show it in a
        sandboxed frame, never in the console's own page.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: projectId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 'The rendered page or email: one HTML document.'
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The API key is missing, unknown, expired or revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The API key may not act on this workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such resource, or the caller may not see it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The caller sent more requests than its API key's or its workspace's limit allows.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The sign-in engine that renders the preview cannot be reached. Nothing was saved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Branding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingPreview'
