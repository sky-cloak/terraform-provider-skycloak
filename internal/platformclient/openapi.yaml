  /v1/workspaces/{workspaceId}/projects/{projectId}/branding/logo:
    put:
      operationId: ProjectBranding_uploadLogo
      description: |-
        Uploads a project's logo: the body is the file, a PNG, JPEG or SVG of at most 512 KB, with its
        type as the Content-Type. The file must really be of that type, and an SVG may hold no script
        and no reference outside the file, or the upload answers 400 saying why; a refusal of the file,
        the 413 included, names `logo` in `field`. The platform serves
        the file on the project's own sign-in address and writes that address into the branding as
        `logoUrl`, live at once; the answer is the branding as it now is. A project of another
        workspace, or a deleted one, answers 404.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
