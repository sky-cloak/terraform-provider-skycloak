  /v1/staff/sign-in:
    post:
      operationId: StaffSignIns_create
      description: |-
        Starts a staff sign-in on the IAM's own sign-in page and answers where to send the browser.
        The pending sign-in is the `staff_sign_in` cookie, holding its state, nonce and PKCE code
        verifier for ten minutes. A redirect address the staff app's client does not register is a
        400.
      parameters: []
      responses:
        '201':
          description: 'Answered by a create: the new resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSignInRedirect'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            The request sent an Authorization header: an API key or a console access token never reaches
            a staff operation, whatever cookie comes with it. Or the person signed in through Skycloak's
            IAM does not hold the staff role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |-
