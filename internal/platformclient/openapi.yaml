              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The API key may not act on this workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such resource, or the caller may not see it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The caller sent more requests than its API key's or its workspace's limit allows.
          headers:
            Retry-After:
              required: true
              description: Whole seconds to wait before the next request can succeed.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Usage could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Usage
security:
  - BearerAuth: []
components:
  parameters:
    MonthParameter:
      name: month
      in: query
      required: false
      description: |-
        The UTC calendar month, as `YYYY-MM`. It defaults to the current month; a month still to
        come answers 400.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      explode: false
    PageParameters.cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page; absent for the first page.
      schema:
        type: string
      explode: false
    PageParameters.limit:
      name: limit
      in: query
      required: false
      description: The most items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      explode: false
  schemas:
    ActiveUser:
      type: object
      required:
        - userId
        - firstSignedInAt
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        firstSignedInAt:
          type: string
          format: date-time
          description: The user's first counted sign-in in the month.
      description: 'One counted user: who, and when their first sign-in of the month was.'
    ActiveUserCount:
      type: object
      required:
        - projectId
        - month
        - monthStart
        - monthEnd
        - activeUsers
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: The UTC calendar month counted, as `YYYY-MM`.
        monthStart:
          type: string
          format: date-time
          description: The month's first midnight, UTC.
        monthEnd:
          type: string
          format: date-time
          description: The next month's first midnight, UTC, exclusive.
        activeUsers:
          type: integer
          format: int32
          minimum: 0
          description: |-
            The distinct users who completed a password, passkey, email code or link, or social sign-in
            in the month. Silent sign-in on an existing session, refresh and client credentials do not
            count.
      description: A project's count of active users in one UTC calendar month.
    ActiveUserPage:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveUser'
          description: The counted users on this page, earliest first sign-in first.
        nextCursor:
          type: string
          description: Set when more users follow; absent on the last page.
        total:
          type: integer
          format: int32
          minimum: 0
          description: "All the counted users of the month, over every page: always the month's `activeUsers`."
      description: A page of the counted users, ordered by first sign-in, earliest first.
    AddCustomDomain:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes. Another project's domain cannot be
            added.
      description: What adding a project's custom domain takes.
    ApiKey:
      type: object
      required:
        - id
        - workspaceId
        - name
        - prefix
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the key is for, as the console shows it.
        prefix:
          type: string
          description: The first characters of the secret, to tell keys apart.
          readOnly: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: |-
            What the key may do. Left out when creating a key, it is every read scope; answers always
            carry it.
        projectId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The one project the key may act on; absent when it covers the whole workspace.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working; absent when it never expires.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: When the key last called the API; absent if it never has.
          readOnly: true
      description: An API key a workspace uses to call this API. Its secret is shown only once.
    ApiKeyPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    ApiKeyScope:
      type: object
      required:
        - scope
        - description
        - ownerOnly
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        description:
          type: string
          description: What the scope lets a key do, in one sentence.
        ownerOnly:
          type: boolean
          description: Whether only an Owner grants it, when creating a key; no default or write scope holds it.
      description: One scope a key may hold, as the console offers it when a key is created.
    ApiKeyScopeList:
      type: object
