          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Staff
      security:
        - StaffSessionAuth: []
    delete:
      operationId: StaffSessions_delete
      description: 'Signs the person out of the staff app: ends the staff session and clears the cookie.'
      parameters: []
      responses:
        '204':
          description: 'Answered by a delete: the resource is gone.'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            There is no staff session: the `staff_session` cookie is missing, unknown, expired or ended.
            The console's `session` cookie is not a staff session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
