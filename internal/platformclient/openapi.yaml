      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSignInStart'
      security:
        - {}
  /v1/staff/sign-in/complete:
    post:
      operationId: StaffSignIns_complete
      description: |-
        Completes a staff sign-in with what the IAM sent back and, for a person the IAM grants the
        staff role, sets the `staff_session` cookie in place of any staff session the browser had.
        A person without the role gets 403 and no session.
      parameters: []
      responses:
        '201':
          description: 'Answered by a create: the new resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '400':
          description: The request is malformed or a field is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'The sign-in did not complete: it expired, was started in another browser, or the IAM refused it.'
          content:
            application/problem+json:
