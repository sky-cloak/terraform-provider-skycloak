components:
  parameters:
    CommonParameters:
      name: API-Version
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Versions'
    Pagination.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return.
      schema:
        allOf:
          - $ref: '#/components/schemas/PageLimit'
        default: 25
      explode: false
    Pagination.offset:
      name: offset
      in: query
      required: false
      description: Number of results to skip from the start.
      schema:
        allOf:
          - $ref: '#/components/schemas/PageOffset'
        default: 0
      explode: false
  schemas:
    AcceptedResourceHeaders:
      type: object
    ActiveUserCounts:
      type: object
      required:
        - monthly
        - weekly
        - daily
      properties:
        monthly:
          type: integer
          format: int64
          description: Distinct users who logged in during the last 30 days.
        weekly:
          type: integer
          format: int64
          description: Distinct users who logged in during the last 7 days.
        daily:
          type: integer
          format: int64
          description: Distinct users who logged in during the last 24 hours.
      description: Active user counts across fixed rolling time windows.
    AddCAPTCHADomainRequest:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
          x-oapi-codegen-extra-tags:
            validate: hostname_rfc1123
    AdminOperationType:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - ACTION
    Application:
      type: object
      required:
        - client_id
        - name
        - type
        - protocol
        - status
        - redirect_uris
        - grant_types
        - pkce_required
        - consent_required
        - service_account_enabled
        - created_at
        - updated_at
      properties:
        client_id:
          allOf:
            - $ref: '#/components/schemas/ApplicationClientId'
          description: OAuth 2.0 client identifier. Stable resource identifier for this API.
        name:
          type: string
          description: Human-readable display name.
        description:
          type: string
          description: Optional description of the application.
        type:
          allOf:
            - $ref: '#/components/schemas/ApplicationType'
          description: OAuth 2.0 client type.
        protocol:
          allOf:
            - $ref: '#/components/schemas/ApplicationProtocol'
          description: Authentication protocol.
        status:
          allOf:
            - $ref: '#/components/schemas/ApplicationStatus'
          description: Whether the application is active.
        redirect_uris:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: Allowed redirect URIs for authorization-code flows. Required for `authorization_code` grant.
        grant_types:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
          description: Enabled OAuth 2.0 grant types.
        pkce_required:
          type: boolean
          description: Whether PKCE (Proof Key for Code Exchange) is required.
        consent_required:
          type: boolean
          description: Whether user consent is required before issuing tokens.
        service_account_enabled:
          type: boolean
          description: Whether this application has a service account for machine-to-machine flows. Derived from the `client_credentials` grant type.
        client_secret:
          type: string
          format: password
          description: Client secret. Present only immediately after creation or secret rotation; store it securely as it will not be returned again.
        saml_config:
          allOf:
            - $ref: '#/components/schemas/SAMLConfiguration'
          description: SAML-specific configuration. Present only when `protocol` is `saml`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: A Keycloak client (application) registered in a realm.
    ApplicationClientId:
      type: string
      minLength: 1
      maxLength: 255
      description: OAuth 2.0 client identifier. Used as the stable resource identifier in this API and in Keycloak realm URLs.
    ApplicationProtocol:
      type: string
      enum:
        - openid-connect
        - saml
      description: Authentication protocol used by the application.
    ApplicationRole:
      type: object
      required:
        - name
        - composite
        - client_role
      properties:
        name:
          type: string
          description: Role name.
        description:
          type: string
          description: Optional role description.
        composite:
          type: boolean
          description: Whether this is a composite role (a role that inherits other roles).
        client_role:
          type: boolean
          description: Whether this is a client role (as opposed to a realm role).
      description: A role assigned to an application's service account.
    ApplicationSession:
      type: object
      required:
        - id
        - user_id
        - username
        - started_at
        - last_access_at
      properties:
        id:
          type: string
          description: Session identifier.
        user_id:
          type: string
          description: Keycloak user ID.
        username:
          type: string
          description: Username of the authenticated user.
        email:
          type: string
          description: Email of the authenticated user.
        ip_address:
          type: string
          description: IP address the session originated from.
        started_at:
          type: string
          format: date-time
          description: When the session started.
        last_access_at:
          type: string
          format: date-time
          description: When the session was last active.
      description: An active user session for an application.
    ApplicationStatus:
      type: string
      enum:
        - active
        - inactive
      description: Whether the application is accepting logins.
    ApplicationType:
      type: string
      enum:
        - confidential
        - public
      description: OAuth 2.0 client type. Confidential clients can hold a secret; public clients cannot.
    AssignRealmUserRolesRequest:
      type: object
      required:
        - role_names
      properties:
        role_names:
          type: array
          items:
            $ref: '#/components/schemas/RealmRoleName'
          minItems: 1
          description: Role names to assign to the user.
      example:
        role_names:
          - admin
          - viewer
    AssignRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Role name.
        role_client_id:
          type: string
          description: OAuth client_id of the owning client for client roles. Omit or leave empty for realm roles.
      description: Request body for assigning a role to an application's service account.
    AuthenticationMetrics:
      type: object
      required:
        - login_attempts
        - login_successes
        - login_failures
        - token_issuances
        - token_validations
        - password_validations
        - by_protocol
      properties:
        login_attempts:
          $ref: '#/components/schemas/MetricSeries'
        login_successes:
          $ref: '#/components/schemas/MetricSeries'
        login_failures:
          $ref: '#/components/schemas/MetricSeries'
        token_issuances:
          $ref: '#/components/schemas/MetricSeries'
        token_validations:
          $ref: '#/components/schemas/MetricSeries'
        password_validations:
          $ref: '#/components/schemas/MetricSeries'
        by_protocol:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolStat'
      description: Authentication activity time series over the requested time window.
    BotChallengeMode:
      type: string
      enum:
        - none
        - javascript
        - captcha
    BotManagementConfig:
      type: object
      required:
        - enabled
        - mode
        - challenge_mode
      properties:
        enabled:
          type: boolean
        mode:
          $ref: '#/components/schemas/SecurityMode'
        challenge_mode:
          $ref: '#/components/schemas/BotChallengeMode'
        whitelisted_agents:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: User-agent regex patterns to always allow through.
        blacklisted_agents:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: User-agent regex patterns to always block.
    BrandingStatus:
      type: string
      enum:
        - applying
        - applied
        - failed
    BuildId:
      type: string
      format: uuid
    CAPTCHAConfig:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        enabled_realms:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: Realm IDs where CAPTCHA challenges are presented during the login flow.
    CAPTCHADomain:
      type: object
      required:
        - hostname
        - created_at
      properties:
        hostname:
          type: string
        created_at:
          type: string
          format: date-time
      description: A hostname registered for CAPTCHA protection.
    CAPTCHADomainsInfo:
      type: object
      required:
        - domains
        - max_allowed
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/CAPTCHADomain'
        max_allowed:
          type: integer
          description: Maximum number of domains that can be registered for this cluster.
    CAPTCHAEventMetrics:
      type: object
      required:
        - total_challenges
        - successful_solves
        - failed_solves
        - timeouts
        - success_rate
        - avg_solve_time_ms
      properties:
        total_challenges:
          type: integer
          format: int64
        successful_solves:
          type: integer
          format: int64
        failed_solves:
          type: integer
          format: int64
        timeouts:
          type: integer
          format: int64
        success_rate:
          type: number
          format: double
          description: Ratio of successful solves to total challenges (0–1).
        avg_solve_time_ms:
          type: integer
          format: int64
          description: Mean time to solve a challenge, in milliseconds.
    ClientStats:
      type: object
      required:
        - client_id
        - client_name
        - login_count
        - realm_name
      properties:
        client_id:
          type: string
        client_name:
          type: string
        login_count:
          type: integer
          format: int64
        realm_name:
          type: string
      description: Activity summary for a single service-account client.
    ClientThemeAssignment:
      type: object
      required:
        - login
      properties:
        login:
          type: string
          allOf:
            - $ref: '#/components/schemas/ThemeId'
