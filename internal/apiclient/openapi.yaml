        - http_relative_path
        - created_at
        - updated_at
        - features
        - features_disabled
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ClusterId'
          description: Unique cluster identifier.
        name:
          allOf:
            - $ref: '#/components/schemas/ClusterName'
          description: Human-readable cluster name.
        type:
          $ref: '#/components/schemas/ClusterType'
        size:
          $ref: '#/components/schemas/ClusterSize'
        version:
          $ref: '#/components/schemas/KeycloakVersion'
        location:
          $ref: '#/components/schemas/ClusterLocation'
        status:
          $ref: '#/components/schemas/ClusterStatus'
        management_mode:
          $ref: '#/components/schemas/ManagementMode'
        url:
