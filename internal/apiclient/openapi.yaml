    RealmStats:
      type: object
      required:
        - realm_id
        - realm_name
        - user_count
        - login_count
      properties:
        realm_id:
          type: string
        realm_name:
          type: string
        user_count:
          type: integer
          format: int64
        login_count:
          type: integer
          format: int64
      description: Activity summary for a single realm.
    RealmSubGroup:
      type: object
      required:
