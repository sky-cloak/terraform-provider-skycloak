        - rate
      properties:
        protocol:
          type: string
          example: openid-connect
        count:
          type: integer
          format: int64
        rate:
          type: number
          format: double
          description: Fraction of total login events for this protocol (0–1).
      description: Authentication event count broken down by protocol.
    ProviderConfig:
      type: object
      properties:
        oidc:
          allOf:
            - $ref: '#/components/schemas/OIDCConfig'
          description: OIDC-specific endpoints. Required when `type` is `oidc`.
        saml:
          allOf:
            - $ref: '#/components/schemas/SAMLIdPConfig'
          description: SAML-specific settings. Required when `type` is `saml`.
        ldap:
          allOf:
            - $ref: '#/components/schemas/LDAPConfig'
          description: LDAP-specific settings. Required when `type` is `ldap`.
        icon_url:
          type: string
          maxLength: 2048
          format: uri
          description: URL to the logo displayed on the login button.
        button_text:
          type: string
          maxLength: 100
          description: Label of the SSO login button shown to end users.
          example: Continue with Okta
        attribute_mappings:
          type: object
          additionalProperties:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: Keycloak attribute name → IdP claim name mappings applied when importing user profiles.
          example:
            email: email
            firstName: given_name
            lastName: family_name
        sync_mode:
          allOf:
            - $ref: '#/components/schemas/SyncMode'
          default: import
        trust_email:
          type: boolean
          description: When `true`, Keycloak trusts email addresses provided by this IdP without sending a verification email. Enable only for providers that verify email addresses themselves.
      description: Protocol-specific configuration and shared display options. Populate only the sub-object that matches `type`.
    ProviderId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[a-zA-Z0-9_-]+$
