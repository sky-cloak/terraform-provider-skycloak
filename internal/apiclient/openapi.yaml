          description: Local start time, `HH:MM`.
        end_local:
          type: string
          description: Local end time, `HH:MM`.
        timezone:
          type: string
          description: IANA timezone, e.g. `Europe/Berlin`.
      description: 'A cluster maintenance window: when Skycloak applies upgrades and other disruptive changes.'
    ManagementMode:
      type: string
      enum:
        - full
      description: Skycloak manages the full lifecycle of the cluster. Every cluster is fully managed.
    MatchedSecurityRule:
      type: object
