      properties:
        version:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
          minLength: 1
          maxLength: 50
          description: Semantic version string for the new release (e.g. `"1.2.0"`).
      description: Version metadata submitted as the `metadata` part of a `multipart/form-data` upload.
    RateLimitHeaders:
      type: object
    RateLimitingConfig:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        global_rpm:
          type: integer
          minimum: 1
          description: Global requests-per-minute ceiling across all clients.
        per_ip_rpm:
          type: integer
          minimum: 1
          description: Per-source-IP requests-per-minute ceiling.
        endpoint_limits:
          type: array
          items:
            $ref: '#/components/schemas/EndpointRateLimit'
    Realm:
      type: object
      required:
        - id
        - name
        - display_name
        - enabled
        - ssl_required
        - registration_allowed
        - registration_email_as_username
        - login_with_email_allowed
        - duplicate_emails_allowed
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/RealmId'
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          allOf:
            - $ref: '#/components/schemas/RealmName'
          example: customer-portal
        display_name:
          allOf:
            - $ref: '#/components/schemas/RealmDisplayName'
          example: Customer Portal
        enabled:
          type: boolean
          description: Whether users can sign in to this realm.
          example: true
        ssl_required:
          $ref: '#/components/schemas/RealmSslRequired'
        registration_allowed:
          type: boolean
          description: Whether self-registration is open to anyone.
          example: false
        registration_email_as_username:
          type: boolean
          description: Whether email addresses are used as usernames during registration.
          example: false
        login_with_email_allowed:
          type: boolean
          description: Whether users can sign in with their email address instead of username.
          example: true
        duplicate_emails_allowed:
          type: boolean
          description: Whether multiple accounts may share the same email address.
          example: false
        created_at:
          type: string
          format: date-time
          description: Time when the realm was created, when available.
      description: Realm details.
      example:
        id: 123e4567-e89b-12d3-a456-426614174000
        name: customer-portal
        display_name: Customer Portal
        enabled: true
        ssl_required: external
        registration_allowed: false
        registration_email_as_username: false
        login_with_email_allowed: true
        duplicate_emails_allowed: false
    RealmDisplayName:
      type: string
      minLength: 1
      maxLength: 255
    RealmGroup:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/RealmGroupId'
          example: 4f7e3a1b-2c9d-4e5f-8a6b-1c2d3e4f5a6b
        name:
          type: string
          example: engineering
        path:
          allOf:
            - $ref: '#/components/schemas/RealmGroupPath'
          description: Canonical group path.
          example: /engineering
        sub_group_count:
          type: integer
          description: Number of direct child groups.
          example: 2
        subgroups:
          type: array
          items:
            $ref: '#/components/schemas/RealmSubGroup'
          description: Direct child groups. Only populated when `include_subgroups=true` is passed to the list endpoint.
      example:
        id: 4f7e3a1b-2c9d-4e5f-8a6b-1c2d3e4f5a6b
        name: engineering
        path: /engineering
        sub_group_count: 2
    RealmGroupId:
      type: string
      format: uuid
      example: 4f7e3a1b-2c9d-4e5f-8a6b-1c2d3e4f5a6b
    RealmGroupPath:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^/.+$
      description: Canonical realm group path.
      example: /engineering/platform
    RealmId:
      type: string
      format: uuid
      description: Keycloak realm ID. This is a UUID generated by Keycloak.
      example: 123e4567-e89b-12d3-a456-426614174000
    RealmName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-zA-Z][a-zA-Z0-9-]*$
      description: Keycloak realm name (not ID). Must start with a letter; allows letters, digits, and hyphens.
      example: customer-portal
    RealmRole:
      type: object
      required:
