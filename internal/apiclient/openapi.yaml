      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/RealmRoleName'
          example: admin
        description:
          type: string
          nullable: true
          description: Human-friendly role description, when available.
          example: Administrative access
        composite:
          type: boolean
          description: Whether this role is composed from other roles.
          example: false
        client_role:
          type: boolean
          description: Whether this is a client-scoped role rather than a realm-scoped role.
          example: false
      example:
        name: admin
        description: Administrative access
        composite: false
        client_role: false
    RealmRoleName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9._:@-]+$
      description: Role name.
      example: admin
    RealmSslRequired:
      type: string
