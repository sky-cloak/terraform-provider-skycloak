          description: Keycloak instance URL. Only non-empty once the cluster reaches `available` status.
        sso_enabled:
          type: boolean
          description: Whether admin console SSO integration is enabled for this cluster.
        auto_upgrade_enabled:
          type: boolean
          description: Whether automatic patch upgrades are enabled for this cluster.
        http_relative_path:
          type: string
          description: Path prefix Keycloak is served from (e.g. `/auth`). Empty string means `/`.
          example: ''
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        features:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: Keycloak feature flags explicitly enabled on this cluster.
        features_disabled:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
          description: Keycloak feature flags explicitly disabled on this cluster.
