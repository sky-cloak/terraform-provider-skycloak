    patch:
      operationId: updateCluster
      summary: Update a cluster
      description: |-
        Updates one or more fields on the cluster. All fields are optional — only the fields provided are changed.

        **Version upgrades**

        Set `version` to upgrade the cluster to a newer Keycloak version. Upgrades are **sequential only** — you must
        upgrade one version at a time. To determine the correct next version, use the
        `GET /clusters/{cluster_id}/upgrade-path` endpoint, which returns the ordered sequence of versions the cluster
        must pass through to reach the latest available version.

        Attempting to skip a version returns `409 Conflict`. Downgrading to a lower version is not supported.

        Major version upgrades (e.g. 25.x → 26.x) include database schema migrations that cannot be easily reversed.
        Cancelling a major upgrade mid-flight via `POST /clusters/{cluster_id}/upgrades/cancel` is possible but risky
        if migrations have already been applied.

        Required scope: `clusters:write`
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClusterId'
        - $ref: '#/components/parameters/CommonParameters'
      responses:
        '200':
          description: The request has succeeded.
          content:
