        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        current_plan:
          type: string
        required_plan:
          type: string
        current_usage:
          type: integer
          description: How many of the resource the workspace currently has.
        current_limit:
          type: integer
          description: Maximum allowed by the current plan.
      description: Returned when a workspace plan quota would be exceeded. `required_plan` indicates the minimum plan needed to complete the request.
    ProtocolStat:
      type: object
      required:
        - protocol
