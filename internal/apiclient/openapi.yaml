        name:
          type: string
          example: infra
        path:
          allOf:
            - $ref: '#/components/schemas/RealmGroupPath'
          description: Canonical group path.
          example: /engineering/infra
        sub_group_count:
          type: integer
          description: Number of direct child groups.
          example: 0
      example:
        id: 53b1957b-9f3e-4a74-b0ff-d585d599a95a
        name: infra
        path: /engineering/infra
        sub_group_count: 0
    RealmUser:
      type: object
      required:
        - id
        - username
        - email
        - enabled
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/RealmUserId'
