        - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
        - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
        - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
      description: SAML NameID format.
    OIDCConfig:
      type: object
      properties:
        issuer:
          type: string
          maxLength: 2048
          format: uri
          description: OIDC issuer identifier URL. Use `POST /identity-providers/discover-oidc` to fetch endpoints from the issuer automatically.
          example: https://accounts.google.com
        authorization_url:
          type: string
          maxLength: 2048
          format: uri
          description: Authorization endpoint. Derived from discovery when `issuer` is supplied.
          example: https://accounts.google.com/o/oauth2/v2/auth
        token_url:
          type: string
          maxLength: 2048
          format: uri
          description: Token endpoint. Derived from discovery when `issuer` is supplied.
          example: https://oauth2.googleapis.com/token
        userinfo_url:
          type: string
          maxLength: 2048
          format: uri
          description: UserInfo endpoint.
          example: https://openidconnect.googleapis.com/v1/userinfo
        logout_url:
          type: string
          maxLength: 2048
          format: uri
          description: End-session (logout) endpoint.
    OIDCDiscoveryDocument:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
        response_types_supported:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
            x-oapi-codegen-extra-tags:
              validate: omitnil,max=500
      description: OIDC discovery document from the issuer's `/.well-known/openid-configuration` endpoint.
    PageLimit:
      type: integer
      minimum: 1
      maximum: 100
    PageOffset:
      type: integer
      minimum: 0
    PaginationHeaders:
      type: object
      description: RFC 8288 pagination headers.
    PerformanceMetrics:
      type: object
      required:
        - response_times
        - memory_usage
        - cpu_usage
        - max_cpu_usage
        - garbage_collection
        - thread_count
      properties:
        response_times:
          $ref: '#/components/schemas/ResponseTimeMetrics'
        memory_usage:
          allOf:
            - $ref: '#/components/schemas/MetricSeries'
          description: JVM heap usage as a percentage (0–100).
        cpu_usage:
          allOf:
            - $ref: '#/components/schemas/MetricSeries'
          description: Mean CPU utilization across all pods (0–100+, may exceed 100 on multi-core systems).
        max_cpu_usage:
          allOf:
            - $ref: '#/components/schemas/MetricSeries'
          description: Peak CPU utilization across all pods.
        garbage_collection:
          allOf:
            - $ref: '#/components/schemas/MetricSeries'
          description: JVM garbage collection overhead.
        thread_count:
          allOf:
            - $ref: '#/components/schemas/MetricSeries'
