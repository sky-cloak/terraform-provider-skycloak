        weekly_active_clients:
          type: integer
          format: int64
          description: Distinct clients that authenticated during the last 7 days.
        daily_active_clients:
          type: integer
          format: int64
          description: Distinct clients that authenticated during the last 24 hours.
        total_client_logins:
          type: integer
          format: int64
        total_client_attempts:
          type: integer
          format: int64
        client_success_rate:
          type: number
          format: double
          description: Ratio of successful client authentications to total attempts (0–1).
        total_client_registrations:
          type: integer
          format: int64
        total_client_registration_attempts:
          type: integer
          format: int64
        client_registration_success_rate:
          type: number
          format: double
          description: Ratio of successful client registrations to total attempts (0–1).
        top_clients:
