  /clusters/{cluster_id}/security-logs:
    get:
      operationId: listClusterSecurityLogs
      summary: List security logs
      description: |-
        Returns WAF, bot detection, geo-blocking, rate limiting, and IP access control events for the cluster,
        sorted by `created_at` (newest first by default).

        When neither `start_time` nor `end_time` is provided the query covers the last hour.
        The maximum date range is 90 days.

        Required scope: `clusters:logs:read`
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ClusterId'
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            allOf:
              - $ref: '#/components/schemas/LogPageLimit'
            default: 100
          explode: false
        - name: offset
          in: query
          required: false
          description: Number of results to skip from the start.
          schema:
            allOf:
              - $ref: '#/components/schemas/PageOffset'
            default: 0
          explode: false
        - name: start_time
          in: query
          required: false
          description: Inclusive start time (ISO 8601). Defaults to one hour ago when omitted.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          description: Inclusive end time (ISO 8601). Defaults to the current time when omitted.
          schema:
            type: string
            format: date-time
        - name: type
          in: query
          required: false
          description: Filter by event type.
          schema:
            $ref: '#/components/schemas/SecurityEventType'
          explode: false
        - name: action
          in: query
          required: false
          description: Filter by action taken on the request.
          schema:
            $ref: '#/components/schemas/SecurityEventAction'
          explode: false
        - name: source_ip
          in: query
          required: false
          description: Filter by exact source IP address (IPv4 or IPv6).
          schema:
            type: string
            maxLength: 45
            x-oapi-codegen-extra-tags:
              validate: ip
          x-oapi-codegen-extra-tags:
            validate: ip
          explode: false
        - name: country
          in: query
          required: false
          description: Filter by ISO 3166-1 alpha-2 country code (uppercase).
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            minLength: 2
            maxLength: 2
            x-oapi-codegen-extra-tags:
              validate: iso3166_1_alpha2
          x-oapi-codegen-extra-tags:
