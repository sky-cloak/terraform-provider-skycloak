    WAFCategories:
      type: object
      required:
        - protocol_enforcement
        - protocol_attacks
        - local_file_inclusion
        - remote_file_inclusion
        - remote_code_execution
        - php_injection
        - cross_site_scripting
        - sql_injection
        - session_fixation
        - java_attacks
        - data_leakage
        - webshell_detection
      properties:
        protocol_enforcement:
          type: boolean
          description: Protocol Enforcement (rules 920xxx, ~30–40 rules) — HTTP protocol violations and malformed requests.
        protocol_attacks:
          type: boolean
          description: Protocol Attacks (rules 921xxx, ~25–30 rules) — CRLF injection, HTTP request smuggling, and header attacks.
        local_file_inclusion:
          type: boolean
          description: Local File Inclusion (rules 930xxx, ~15–20 rules) — Path traversal attacks and directory access attempts.
        remote_file_inclusion:
          type: boolean
          description: Remote File Inclusion (rules 931xxx, ~10–15 rules) — Remote URL inclusion and SSRF attacks.
        remote_code_execution:
          type: boolean
          description: Remote Code Execution (rules 932xxx, 60+ rules) — Command injection, shell attacks, and code execution.
        php_injection:
          type: boolean
          description: PHP Injection (rules 933xxx, ~30–40 rules) — PHP function exploitation and serialization attacks.
        cross_site_scripting:
          type: boolean
          description: Cross-Site Scripting (rules 941xxx, ~50–60 rules) — Script injection, event handlers, and DOM-based XSS.
        sql_injection:
          type: boolean
          description: SQL Injection (rules 942xxx, ~55–65 rules) — Database query manipulation and blind SQLi attacks.
        session_fixation:
          type: boolean
          description: Session Fixation (rules 943xxx, ~15–20 rules) — Session manipulation, JWT attacks, and cookie poisoning.
        java_attacks:
          type: boolean
          description: Java/JVM Attacks (rules 944xxx, ~20–30 rules) — Log4Shell, Spring4Shell, and Java deserialization.
        data_leakage:
          type: boolean
          description: Data Leakage Prevention (rules 950–954xxx, 50+ rules) — Credit cards, SSNs, stack traces, and error messages.
        webshell_detection:
          type: boolean
          description: Webshell Detection (rules 955xxx, ~20–30 rules) — Backdoor scripts and malicious shell detection.
      description: OWASP CRS rule categories available for selection when `preset` is `custom`.
