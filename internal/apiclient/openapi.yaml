          description: Client secret for the automation service account. Use with the OAuth2 client_credentials grant.
        token_url:
          type: string
          format: uri
          description: Token endpoint URL (master realm). POST a client_credentials request here to obtain an access token.
      description: Programmatic automation credentials for a cluster's Keycloak (OAuth2 client_credentials grant). Use these from Terraform, CI, or MCP. Separate from Admin Console SSO (human login) and from your Skycloak API key (which manages clusters).
    ClusterExtension:
      type: object
      required:
        - extension_id
        - extension_name
        - extension_source
        - status
        - installed_version
        - available_version
        - upgrade_available
        - parameters
        - installed_at
        - last_status_change_at
      properties:
        extension_id:
          $ref: '#/components/schemas/ExtensionId'
        extension_name:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitnil,max=500
        extension_source:
          $ref: '#/components/schemas/ExtensionSource'
        status:
          $ref: '#/components/schemas/ClusterExtensionStatus'
        installed_version:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitnil,max=500
          description: Version currently running on the cluster.
        available_version:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitnil,max=500
